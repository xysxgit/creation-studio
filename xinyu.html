<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>心屿</title>
    <style>
        :root {
            --bg-start: #fdfbf7;
            --bg-end: #f9f2f0;
            --accent: #cbb0c0;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.7);
            --text: #5b4a5a;
            --text-light: #8a7b8a;
            --btn-bg: rgba(255, 255, 255, 0.8);
            --btn-hover: rgba(255, 255, 255, 1);
            --btn-active-bg: rgba(200, 180, 190, 0.4);
            --shadow: 0 12px 30px rgba(140, 110, 130, 0.1), 0 6px 12px rgba(0, 0, 0, 0.05);
            --radius: 30px;
            --font: 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --game-mode-bg: rgba(60, 50, 60, 0.6);
            --game-mode-text: #e0d5e0;
            --game-mode-active-bg: rgba(140, 120, 140, 0.5);
            --game-mode-active-text: #f5eef5;
            --game-mode-hover: rgba(80, 70, 80, 0.7);
            --game-mode-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* 深色：背景改为深夜紫粉渐变，整体协调 */
                --bg-start: #191425;
                --bg-end: #241a2b;
                --accent: #c9a7c0;
                --card-bg: rgba(45, 36, 50, 0.72);
                --card-border: rgba(130, 104, 130, 0.35);
                --text: #efe4ee;
                --text-light: #b9a9ba;
                --btn-bg: rgba(58, 46, 62, 0.75);
                --btn-hover: rgba(76, 60, 80, 0.95);
                --btn-active-bg: rgba(150, 122, 150, 0.5);
                --shadow: 0 12px 30px rgba(0,0,0,0.45), 0 6px 12px rgba(0,0,0,0.3);
                --game-mode-bg: rgba(40, 34, 44, 0.85);
                --game-mode-text: #e6d9e6;
                --game-mode-active-bg: rgba(150, 122, 150, 0.55);
                --game-mode-active-text: #f8f0f8;
                --game-mode-hover: rgba(62, 52, 66, 0.9);
                --game-mode-shadow: 0 4px 12px rgba(0,0,0,0.5);
            }
            /* 深色适配：把硬编码浅底组件统一转深，保证协调可读 */
            .modal-dialog, .stage-option, .special-option, .archive-select,
            .archive-result, .explanation-box, .special-skip-btn,
            .small-btn, .test-btn-sm, .shop-item button,
            .favorite-btn, .role-badge, .match-label,
            .rank-table th, .rank-table td, .shop-item, .fav-item,
            .shop-section h4, .match-section-title, .archive-header,
            #resultTitle, #quizTitle, #resultMessage, #quizQuestion {
                background-color: rgba(56, 45, 60, 0.94) !important;
                color: var(--text) !important;
                border-color: rgba(130, 104, 130, 0.4) !important;
            }
            .rank-table th, .shop-section h4, .match-section-title,
            .game-difficulty, .role-badge, .match-label {
                color: #cdb9cd !important;
            }
            .stage-option, .special-option, .archive-select {
                border-color: rgba(130, 104, 130, 0.5) !important;
            }
            .action-btn:hover, .stage-option:hover, .special-option:hover,
            .archive-select:hover, .special-skip-btn:hover, .test-btn-sm:hover {
                background-color: rgba(70, 56, 74, 0.96) !important;
                border-color: #c9a7c0 !important;
            }
            .rank-table td { border-color: rgba(130,104,130,0.3) !important; }
            .fav-item:hover, .fav-item:active {
                background: rgba(150, 122, 150, 0.18) !important;
            }
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
        body {
            font-family: var(--font);
            min-height: 100vh;
            /* 优化：静态渐变背景，避免 background-position 大范围动画在移动端持续重绘导致卡顿 */
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            transition: background 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            overflow-y: auto;
            overflow-x: hidden;
        }
        @keyframes bgShift {
            0% {
                background-position: 0% 0%
            }
            100% {
                background-position: 100% 100%
            }
        }
        .main-container {
            position: relative;
            z-index: 1;
            max-width: 460px;
            width: 100%;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .role-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 6px 10px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
        }
        .role-btn {
            flex: 1 1 auto;
            min-width: 55px;
            padding: 8px 4px;
            border: none;
            border-radius: 32px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
            text-align: center;
            opacity: 0.7;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .role-btn:hover {
            opacity: 1;
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }
        .role-btn:active {
            transform: scale(0.95);
            background: var(--btn-active-bg);
            transition: 0.1s;
        }
        .role-btn.active {
            opacity: 1;
            background: var(--btn-active-bg);
            color: #4b3a4e;
            font-weight: 700;
            transform: scale(1.04);
            box-shadow: 0 4px 12px rgba(100, 70, 100, 0.2);
        }
        .role-btn .emoji {
            font-size: 1.3rem;
            margin-bottom: 2px
        }
        .stage-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            color: var(--text);
            font-weight: 700;
            font-size: 1.1rem;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 12px 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 20px rgba(100, 70, 100, 0.08);
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        .stage-indicator:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(100, 70, 100, 0.15);
        }
        .stage-indicator:active {
            transform: scale(0.97);
            transition: 0.1s;
        }
        .stage-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }
        .sentence-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border-radius: var(--radius);
            padding: 32px 24px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            text-align: center;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }
        .sentence-text {
            font-size: 1.25rem;
            line-height: 1.8;
            color: var(--text);
            font-weight: 500;
            word-break: break-word;
            padding-right: 30px;
        }
        .favorite-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 1.3rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, color 0.2s;
            z-index: 2;
            line-height: 1;
            color: #ccc;
        }
        .favorite-btn:hover {
            transform: scale(1.2);
        }
        .favorite-btn:active {
            transform: scale(0.9);
        }
        .favorite-btn.fav {
            color: #ff69b4;
        }
        .role-badge {
            font-size: 0.75rem;
            background: rgba(180, 160, 170, 0.25);
            color: #5b4070;
            padding: 6px 20px;
            border-radius: 40px;
            margin-top: 18px;
            font-weight: 700;
        }
        .action-row {
            display: flex;
            gap: 12px;
            justify-content: center
        }
        .action-btn {
            padding: 14px 30px;
            border-radius: 50px;
            border: 2px solid rgba(180, 160, 170, 0.3);
            background: var(--btn-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 15px rgba(100, 70, 100, 0.08);
        }
        .action-btn:hover {
            background: var(--btn-hover);
            border-color: #cbb0c0;
            transform: scale(1.05);
            box-shadow: 0 12px 28px rgba(100, 70, 100, 0.2);
        }
        .action-btn:active {
            transform: scale(0.96);
        }
        .action-btn.primary {
            background: rgba(180, 150, 170, 0.25);
            border-color: #cbb0c0;
            color: #4b3a4e;
        }
        .explanation-box {
            background: rgba(250, 248, 250, 0.85);
            border-radius: 24px;
            padding: 18px;
            border-left: 5px solid var(--accent);
            color: var(--text-light);
            font-size: 0.85rem;
            display: none;
            text-align: left;
            backdrop-filter: blur(15px);
            animation: fadeSlide 0.3s ease;
            margin-top: 4px;
        }
        .explanation-box.visible {
            display: block
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-10px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 20, 30, 0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.hidden {
            display: none
        }
        .modal-dialog {
            background: rgba(255, 250, 252, 0.95);
            border-radius: 42px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 60px rgba(80, 40, 60, 0.2);
            text-align: center;
            color: var(--text);
            max-height: 85vh;
            overflow-y: auto;
            animation: modalPop 0.35s ease;
            backdrop-filter: blur(20px);
        }
        @keyframes modalPop {
            from {
                transform: scale(0.9);
                opacity: 0
            }
            to {
                transform: scale(1);
                opacity: 1
            }
        }
        .stage-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }
        .stage-option,
        .special-option {
            padding: 18px 10px;
            border-radius: 26px;
            border: 2px solid rgba(200, 190, 200, 0.6);
            background: rgba(255, 250, 252, 0.8);
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.2s;
        }
        .stage-option:hover {
            background: white;
            border-color: #cbb0c0;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(120, 80, 100, 0.18);
        }
        .stage-option:active {
            transform: scale(0.96);
        }
        .special-option:hover {
            background: white;
            border-color: #cbb0c0;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(120, 80, 100, 0.18);
        }
        .special-option:active {
            transform: scale(0.96);
        }
        .special-skip-btn {
            background: rgba(235, 230, 235, 0.8);
            border: 1px solid rgba(180, 160, 180, 0.5);
            color: var(--text);
            padding: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 16px;
            width: 100%;
            transition: 0.2s;
            font-weight: 700;
        }
        .special-skip-btn:hover {
            background: rgba(225, 215, 225, 1);
            transform: scale(1.02);
        }
        .special-skip-btn:active {
            transform: scale(0.97);
        }
        .test-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .test-btn-sm {
            background: rgba(200, 180, 190, 0.3);
            border: 1px solid rgba(200, 180, 190, 0.4);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .test-btn-sm:hover {
            background: rgba(200, 180, 190, 0.5);
            transform: scale(1.05);
        }
        .test-btn-sm:active {
            transform: scale(0.95);
        }
        .progress-bar {
            height: 8px;
            background: rgba(220, 210, 220, 0.4);
            border-radius: 10px;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.3s
        }
        .game-collapse {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            overflow: hidden;
            border-radius: var(--radius);
        }
        .game-header-bar {
            padding: 20px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            color: var(--text);
            font-weight: 800;
            font-size: 1.1rem;
        }
        .game-header-bar:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        .game-header-bar:active {
            background: rgba(255, 255, 255, 0.7);
        }
        .game-header-bar .toggle-icon {
            font-size: 1.5rem;
            transition: transform 0.35s;
        }
        .game-header-bar .toggle-icon.open {
            transform: rotate(90deg)
        }
        .game-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease
        }
        .game-body.open {
            max-height: 1200px
        }
        .game-inner {
            padding: 0 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }
        .game-mode-row {
            display: flex;
            gap: 10px;
            justify-content: center
        }
        .game-mode-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            background: var(--game-mode-bg, rgba(225, 220, 225, 0.7));
    color: var(--game-mode-text, var(--text));
    box-shadow: var(--game-mode-shadow, 0 4px 12px rgba(0,0,0,0.04));
}
.game-mode-btn.active {
    background: var(--game-mode-active-bg, rgba(180, 160, 180, 0.45));
    color: var(--game-mode-active-text, #3b2d3e);
    box-shadow: 0 6px 18px rgba(120, 80, 120, 0.2);
}

        }
   .game-mode-btn:hover:not(.active) {
    background: var(--game-mode-hover, rgba(240, 235, 240, 0.9));
}
        }
        .game-mode-btn:active {
            transform: scale(0.96);
        }
        .game-stats {
            display: flex;
            justify-content: space-between;
            color: var(--text);
            font-size: 0.85rem;
            padding: 0 6px;
            align-items: center;
            font-weight: 600;
        }
        .game-difficulty {
            text-align: center;
            font-size: 0.8rem;
            color: #7b5e77;
            min-height: 22px;
            font-weight: 700;
        }
        .game-hearts {
            color: #d4809a;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        .game-combo {
            text-align: center;
            font-weight: 900;
            min-height: 32px;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: transform 0.15s, color 0.25s;
        }
        .game-canvas {
            width: 100%;
            height: 320px;
            background: radial-gradient(circle at 50% 30%, #3a3340, #1e1a22);
            border-radius: 26px;
            touch-action: none;
            cursor: crosshair;
            border: 1px solid rgba(180, 160, 180, 0.35);
            /* 优化：提示浏览器此元素会频繁重绘，使用独立合成层 */
            will-change: transform;
        }
        .game-btn {
            background: rgba(160, 130, 150, 0.3);
            border: none;
            color: var(--text);
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 6px 15px rgba(100, 70, 100, 0.15);
        }
        .game-btn:hover {
            background: rgba(170, 140, 160, 0.5);
            transform: translateY(-2px);
        }
        .game-btn:active {
            transform: scale(0.98);
        }
        .small-btn {
            background: rgba(240, 235, 240, 0.85);
            padding: 10px;
            font-size: 0.85rem
        }
        .danger-btn {
            background: rgba(255, 200, 200, 0.45);
        }
        .danger-btn:hover {
            background: rgba(255, 160, 160, 0.6);
        }
        .danger-btn:active {
            transform: scale(0.96);
        }
        .rank-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 14px;
            color: var(--text);
        }
        .rank-table th,
        .rank-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(200, 190, 200, 0.5);
            text-align: center;
        }
        .rank-table th {
            color: #5a3e55;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(200, 190, 200, 0.4);
            color: var(--text);
        }
        .shop-item button {
            background: rgba(200, 190, 200, 0.55);
            border: none;
            color: var(--text);
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .shop-item button:hover:not(:disabled) {
            background: rgba(180, 160, 180, 0.8);
            transform: translateY(-1px);
        }
        .shop-item button:active:not(:disabled) {
            transform: scale(0.95);
        }
        .shop-item button:disabled {
            opacity: 0.5;
            background: rgba(220, 210, 220, 0.5);
        }
        .shop-section h4 {
            color: #5a3e55;
            margin-bottom: 8px;
        }
        .fav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(200, 190, 200, 0.3);
            text-align: left;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .fav-item:hover {
            background: rgba(200, 180, 190, 0.1);
            border-radius: 10px;
            padding-left: 8px;
            padding-right: 8px;
        }
        .fav-item:active {
            background: rgba(200, 180, 190, 0.2);
            transform: scale(0.98);
        }
        .fav-item .fav-text {
            flex: 1;
            font-size: 0.9rem;
        }
        .fav-item .fav-meta {
            font-size: 0.7rem;
            color: #8a7b9a;
        }
        .fav-item .fav-remove {
            cursor: pointer;
            font-size: 1.2rem;
            color: #ff69b4;
            transition: transform 0.2s;
        }
        .fav-item .fav-remove:hover {
            transform: scale(1.2);
        }
        .fav-item .fav-remove:active {
            transform: scale(0.9);
        }
        .func-desc {
            font-size: 0.65rem;
            color: #a28aaa;
            margin-top: 2px;
        }
        .shadow-title {
            margin-top: 10px;
            color: #8a7b9a;
            font-size: 0.8rem;
        }
        .archive-modal .modal-dialog {
            max-width: 440px;
        }
        .archive-select-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .archive-select {
            padding: 10px 14px;
            border-radius: 25px;
            border: 2px solid rgba(200, 190, 200, 0.6);
            background: rgba(255, 250, 252, 0.9);
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 100px;
        }
        .archive-select:hover {
            border-color: #cbb0c0;
            background: white;
        }
        .archive-select:active {
            transform: scale(0.97);
        }
        .archive-result {
            background: rgba(250, 248, 252, 0.7);
            border-radius: 20px;
            padding: 16px;
            margin: 12px 0;
            text-align: left;
            font-size: 0.85rem;
            line-height: 1.7;
        }
        .archive-match-score {
            font-size: 1.8rem;
            font-weight: 800;
            color: #cbb0c0;
        }
        .match-label {
            display: inline-block;
            background: rgba(180, 150, 170, 0.2);
            color: #5a3e55;
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 4px;
        }

            { text: '你现在感觉到的危险，有一半来自你的想象力，而你的想象力向来很给力。', exp: '高Ne或高Ni的人能构建极详细的风险场景，这个能力在创造时是天赋，在焦虑时是负担。意识到这个剧本只是众多可能性中的一种，你就已经从导演椅上退了一步。', src: '荣格八维：直觉的阴影' },
            { text: '有些焦虑其实是未被表达的愤怒，或者未被允许的悲伤。问问自己，底下还压着什么。', exp: '情感功能(Fi/Fe)被压抑时，焦虑往往成为代偿性情绪。荣格学派认为，允许底层情感直接表达，焦虑的强度会自然下降，因为它不再需要替别人扛旗。', src: '荣格八维：情感代偿' },
            { text: '如果现在脑子里有一万件事在跑，拿出一张纸，把他们都关进去。', exp: '外倾思维(Te)或内倾思维(Ti)的介入可以迅速降低内倾直觉(Ni)或外倾直觉(Ne)造成的混乱——把模糊的恐惧变成一个个白纸黑字的项目，大脑会觉得“这些已经可以被处理了”。', src: '荣格八维：思维收纳直觉' },
            { text: '你在担心的事情，很可能最终不会发生，但你为它投入的紧张是真的。', exp: '焦虑消耗的能量与应对真实危机几乎相当。当你意识到自己只是在预支痛苦，而不是真的被攻击，你就可能收回一点能量放在当下。', src: '荣格：预支痛苦' },
            { text: '试着不要在这个时候做任何重大决定，除非你已经把焦虑和事实分清楚了。', exp: '焦虑状态下，判断功能（Te/Fe/Ti/Fi）会被直觉功能的灾难脚本带偏。这个时候的任何决定都可能是在为那个虚拟的危机买单，而不是为现实负责。', src: '荣格八维：焦虑期决策原则' },
            { text: '别人眼里你可能很稳，但你自己知道心里在翻江倒海——不用假装没事，你可以说“我现在需要点时间”。', exp: '外倾情感(Fe)型容易在焦虑时还要顾及他人感受，这会使焦虑加倍。允许自己暂时退出社交维护功能，是保护自己不被烧干的必要措施。', src: '荣格八维：Fe暂停' },
            { text: '焦虑有时只是说明你正在靠近一个重要的东西，不是你有危险。', exp: '荣格指出，接近个人成长的关键节点时，无意识会升起焦虑。这是一种“成长的阵痛”，而不是撤退的信号。如果你能看清它的本质，就可以带着它往前走。', src: '荣格：成长焦虑' }
        ],
        sadness: [
            { text: '如果现在很难过，不用急着变好，悲伤有它自己要走的时间。', exp: '内倾情感(Fi)在遭遇价值性丧失时需要一个完整的“哀悼周期”，强行提振只会把这份情绪压入阴影功能，变成更持久的抑郁底色。你的难过不是故障，是对在意的确认。', src: '荣格八维：Fi的哀悼过程' },
            { text: '眼泪不是软弱的证据，是你心里某个在意的东西在说话。', exp: '眼泪是内倾情感(Fi)最直接的生理表达——它说明你触碰到了自己深层价值系统中的某个核心。你没有变得脆弱，你只是在变得更真实。', src: '荣格八维：内倾情感' },
            { text: '有些东西就是会让人难过，这说明你活着，也说明你有在乎的能力。', exp: '悲伤能力是情感功能的健康指标。内倾情感(Fi)或外倾情感(Fe)主导的类型尤其需要为体验悲伤赋予正面意义——你在做的事不是沉溺，而是深度处理那些对你而言真正重要的事。', src: '荣格八维：情感功能健康' },
            { text: '不想说话就不说话，不想见人就不见人。悲伤有权包场。', exp: '外倾情感(Fe)型容易在难过时还想着照顾别人的感受。暂时搁置Fe，让内倾情感(Fi)或内倾感觉(Si)接管，允许自己只是存在而不输出情绪价值。', src: '荣格八维：情感功能轮换' },
            { text: '难过的反面不是快乐，是不再在乎。所以你看，你还很在乎。', exp: '悲伤的强度与在乎的深度成正比。这给了悲伤一个内在的尊严——它证明你的价值系统正在工作，没有麻木。', src: '荣格：情感的真实性' },
            { text: '如果回忆一直找上你，那就和它待一会儿，它不是来伤害你的。', exp: '内倾感觉(Si)在悲伤时可能会不断回放过去的画面，这常常被误解为“放不下”。实际上Si是在帮你整合那些片段，最终会让它们不再尖锐。', src: '荣格八维：Si的整合功能' },
            { text: '你不需要在这个时候还去理解别人，先理解你自己的感受。', exp: 'Ti或Fe在处理悲伤时容易跳转到“为什么他这样”“为什么我这样”，但过度分析或过早共情会跳过情感的直接体验。先感受，后理解。', src: '荣格八维：感受优先' },
            { text: '今天不用做什么，甚至不用想什么，只是让难过像云一样从你身体里飘过。', exp: '正念式的观察情绪，允许它存在而不抓取——这让劣势功能（常与身体连接相关）得到休息，而不让主导功能过度干预。', src: '荣格八维：观察而不卷入' },
            { text: '你不是一定要一个人扛，如果你能说出一句“我不太好”，就已经很勇敢了。', exp: '内倾型(I)在悲伤时容易封闭，但对外倾情感(Fe)或外倾思维(Te)的轻度使用——只是表达出来——本身就能启动情绪调节的外部资源。', src: '荣格八维：情感外化的勇气' },
            { text: '悲伤不会永远停留，但它会改变一些东西，让你对重要的事看得更清。', exp: '哀悼过程完成后，认知功能会重新分配优先级——你会更清楚什么是真正重要的，原来被琐事遮蔽的东西会显影。这是悲伤的礼物。', src: '荣格：哀悼的意义' }
        ],
        lost: [
            { text: '看不清路的时候，先看看脚下踩着什么——你拥有的东西比你意识到的多。', exp: '方向迷失时，内倾直觉(Ni)的远景扫描暂时失灵，但外倾感觉(Se)可以提供“当下盘点”的实感。先确认现有资源，再等远景功能自己恢复——它会的。', src: '荣格八维：Se-Ni配合' },
            { text: '迷路说明你在走新路，一直不迷路的人其实是在原地打转。', exp: '迷茫是内倾直觉(Ni)正在整合新信息、准备生成新方向的前奏。这个阶段看上去像停滞，实际上是认知功能的隐性重组——没有这个混沌期，就不会有新的洞见出现。', src: '荣格八维：Ni的重组过程' },
            { text: '现在不用急着找答案，把手上的事做好，方向会自己慢慢浮上来。', exp: '当Ni的方向感失灵，最佳策略是暂时切换到外倾思维(Te)或外倾感觉(Se)——用“做事”代替“想事”，让直觉系统在后台自行运算。你越想把它抓出来，它躲得越深。', src: '荣格八维：功能切换策略' },
            { text: '有些路就是要在雾里走一段，能见度低不代表前面是悬崖。', exp: '荣格曾比喻个体化过程如同夜航——看不清正是意识正在向无意识学习的时候。这种不确定性是新的可能性的入场票。', src: '荣格：个体化与旅程' },
            { text: '问问自己：如果没有什么可失去的，你会往哪走？这种没有包袱的感觉，就是方向感本身。', exp: '迷茫常常来自对沉没成本的过度眷恋(Si)或对失败的过度预演(Ni)。抽掉那些“怕失去”的东西，内倾情感(Fi)或外倾直觉(Ne)会告诉你真正想去的地方。', src: '荣格八维：剥离恐惧找方向' },
            { text: '你现在不是在退步，是在重新对焦。眯着眼睛找焦距的时候，眼前是模糊的，但那是为了看清未来。', exp: '内倾直觉(Ni)对焦需要时间，它对模糊的容忍度是它产生深度洞见的成本。允许自己暂时看不清，是对Ni工作方式的尊重。', src: '荣格八维：Ni对焦期' },
            { text: '迷茫的时候，最好的计划就是没有计划，先去做一件你确定能完成的小事。', exp: '外倾思维(Te)在目标缺失时会产生巨大焦虑，但通过调动外倾感觉(Se)完成一个微小具体的事，可以重建“我能影响环境”的把握感，为Te重新设定坐标。', src: '荣格八维：Se为Te定锚' },
            { text: '有时候找不到方向，是因为你正在成为新的自己，旧的地图当然不管用了。', exp: '当自我认知升级时，原来匹配的价值观和路径会显得过时。这种迷茫不是崩坏，是系统更新的重启界面。你需要新地图，而不是修复旧地图。', src: '荣格：自我更新' },
            { text: '试着写下你现在确定不要什么，这往往比知道自己要什么更容易。', exp: '内倾情感(Fi)在否定时往往比肯定时更清晰——因为价值被侵犯比价值被满足更容易被感知。反向清单能帮助你逼近那个核心。', src: '荣格八维：Fi反向清单' },
            { text: '你不需要一个人想通所有事。找个你信任的人，哪怕只是把这团乱麻倒给对方，都会清晰很多。', exp: '外倾情感(Fe)或外倾思维(Te)的短暂借用——仅仅是说出来——就能让内倾思考(Ti/Ni)的循环获得外部视角。这也是为什么咨询如此有效。', src: '荣格八维：外化清晰化' }
        ],
        relationship: [
            { text: '关系里最重要的不是你们有多像，而是你们处理“不一样”的方式。', exp: '认知功能堆栈的差异(如Te-Fi轴 vs Ti-Fe轴)会在关系深入时浮现为价值观冲突。高功能的关系不是靠相似性维持，而是靠双方各自发展第五、第六功能去理解对方的“陌生地带”。', src: '荣格八维：功能互补理论' },
            { text: '有时候你对关系的分析太多，对关系的感受太少了——它们俩要轮班。', exp: '如果你习惯用内倾思维(Ti)拆解关系，就会把活生生的人变成需要解决的问题。内倾情感(Fi)或外倾情感(Fe)的介入是必要的——关系不是被分析明白的，是在体验中被整合的。', src: '荣格八维：判断功能平衡' },
            { text: '好的关系不是你的情绪代办处，但可以是你的情绪安全港——你知道这里允许脆弱，不会被评判。', exp: '为彼此提供“容纳环境”是关系深度的标志。这需要双方都有一定程度的内倾情感(Fi)或外倾情感(Fe)的成熟运用——不是解决问题，而是见证和陪伴。', src: '荣格八维：情感容纳' },
            { text: '你们之间最大的误解，可能只是因为你用你的第一功能说事，对方用他的第一功能在听。', exp: '比如，Te的用户在说“我们来解决这个问题”，而Fi的用户听到的是“你觉得我的感受不重要”。识别这种功能翻译误差，比争对错更重要。', src: '荣格八维：功能翻译' },
            { text: '别让关系只靠你的弱势功能来运行，那样你会很辛苦，对方也看不到真正的你。', exp: '如果你一直用劣势功能去配合关系（如一个内倾直觉者强迫自己不停社交），你会内在枯竭，而且对方会感到一种奇怪的不一致。发出你主导功能的信号，关系才会对频。', src: '荣格八维：使用优势功能去连接' },
            { text: '有时候你需要把关系暂停几秒，问自己“如果只是我自己的事，我会怎么做”，那些答案会帮你找到边界。', exp: '课题分离的荣格版本：先区分哪些属于你的内倾情感/思维地带，哪些是对方向你诉说的需求。当你不那么快为对方解决问题时，对方反而有机会发展自己的弱势功能。', src: '荣格八维：课题分离' },
            { text: '吵架吵到一半，如果有一方说“我们先停几秒，我想理解你到底在说什么”，这句话就是关系的急救包。', exp: '在冲突中调动外倾情感(Fe)或内倾情感(Fi)的积极面——从防御转向理解——这需要主动的中断与重启。那一刻，你选择了关系而不是对的。', src: '荣格八维：冲突中的暂停' },
            { text: '你不需要成为对方的治疗师，但你需要成为对方“可以放下剧本”的人。', exp: '荣格认为每个人在关系中都会带着人格面具。如果你们能在彼此面前卸下面具，去展示混乱和脆弱，这段关系就已经在治愈你们了。', src: '荣格：面具与真实' },
            { text: '有时候，关系需要的不是更多沟通，而是更多并肩看日落的时间。', exp: '外倾感觉(Se)和内倾感觉(Si)的共享——一起经历具体的时光，不做深层对话——反而能为直觉(Ni/Ne)和判断(Ti/Fi)的异见提供缓冲。沉默的舒适是高级的亲密。', src: '荣格八维：感官共处' },
            { text: '爱不是被分析出来的，是当你停止分析的时候，还剩下不想放手的东西。', exp: '内倾思维(Ti)过度分析会把爱分解成一堆不浪漫的成分。真正的依恋发生在Ti放下手术刀的时候——那个你仍然感到温暖和重要的人，就是你的情感重心。', src: '荣格八维：超越分析的连接' }
        ],
        strive: [
            { text: '看你最近这么拼，别忘了给自己设个终点线——努力是为了靠近目标，不是为了耗尽自己。', exp: '外倾思维(Te)的驱动力在于“可见成果”，但它会不断抬高目标，让人永远达不到终点。主动定义“什么算够了”是对Te过度扩张的必要制衡。', src: '荣格八维：Te边界设定' },
            { text: '你推进事情的能力很强，但推进自己的时候，记得你是一个“人”不是“项目”。', exp: '高效能状态是Te和Ni的完美配合，但劣势功能(第四功能)往往是情感——你容易把自己当成需要优化的系统，忘记了自己还需要被照顾、被享受。', src: '荣格八维：第四功能提醒' },
            { text: '奋斗不是一场苦行，能把热爱的事做得漂亮，本身就是很大的奖励。', exp: '当内倾情感(Fi)的价值体系与外部行动(Te/Se)对齐时，人会进入“心流”状态——这种状态下的努力不消耗意志力，反而补充精神能量。你所做的，正在接近这个状态。', src: '荣格八维：Fi-Te对齐与心流' },
            { text: '你不是在跟谁竞赛，你的节奏就是标准节拍。', exp: '内倾直觉(Ni)主导的人天然有自己的步调，但社会化的外倾思维(Te)标准可能让你觉得自己太慢。回归你的节拍，深度专注的效率远超表面的多任务。', src: '荣格八维：内倾节拍' },
            { text: '把今天最重要的三件事做完，剩下的时间就是你的自由——这不是偷懒，是设计。', exp: '对于直觉-思维型(NT)，优先级排序本身就是生产力。主动限制任务数量，能让你在最重要的事上投入最强功能，同时保护你免得在次要事上耗尽自己。', src: '荣格八维：功能聚焦' },
            { text: '你正在把想法变成现实，这个从0到1的过程，本身就是生命力。', exp: '将内倾直觉(Ni)或外倾直觉(Ne)的灵感通过外倾思维(Te)或外倾感觉(Se)落地，是心理能量的完整循环。每一步实现都在哺育你的精神。', src: '荣格八维：灵感具现化' },
            { text: '别忘记你最初为什么要开始这件事，那个理由还在，你就没偏航。', exp: '内倾情感(Fi)或内倾直觉(Ni)在漫长奋斗中的动力衰减往往与对初心的遗忘有关。定期回顾最初的“为什么”，能重新点燃最初的核心价值。', src: '荣格八维：初心重置' },
            { text: '有时候你需要从埋头拉车中抬起头，看看天，看看四周的风景。', exp: '长期使用Te或Se可能导致精神隧道视。外倾直觉(Ne)或内倾直觉(Ni)的短暂介入——只是一次散步或与一个有趣的人聊天——能带来意想不到的新径。', src: '荣格八维：功能交叉授粉' },
            { text: '别人能看到你的进展，但只有你知道，那些进展里面装着多少个跟自己较劲的夜晚。', exp: '奋斗中的孤独感常因内倾情感(Fi)或内倾思维(Ti)的深度投入不被外界理解。你不需要所有人都懂，但可以为自己那些被隐藏的斗争点个赞。', src: '荣格八维：自我认可' },
            { text: '最有效的动力不是恐惧，是知道自己正在成为自己想成为的那个人。', exp: '荣格认为个体化进程的驱动力来自自性的呼唤，而不是外在的惩罚或奖赏。当你意识到努力在塑造你的本质，而不是仅仅交换薪酬，你会体验到一种深沉的满足。', src: '荣格：自性驱动' }
        ]
    },
    partner: {
        celebration: [
            { text: '分享好消息给彼此的时候，你们的关系也在被这快乐加固。', exp: '安全型依恋者能够对伴侣的积极事件作出“主动-建设性”回应，这在依恋理论中被称为“资本化”——它不仅放大快乐，还显著增长关系满意度。你们正在做这件事。', src: '依恋理论：资本化' },
            { text: '你们此刻的快乐不是凭空来的，是一路以来选择了彼此的信任。', exp: '安全型依恋的核心特征是“信任可获得性”——你们各自的内部工作模型都确信对方会在需要时出现。这份快乐之所以踏实，是因为它下面垫着无数次“对方确实在场”的经验。', src: '依恋理论：内部工作模型' },
            { text: '能让对方笑这件事，本身就是爱的语言。你做到了。', exp: '《爱的五种语言》中“肯定的言辞”和“精心的时刻”往往也包含制造笑容。你发出的这些积极信号，在不断巩固关系中的安全感。', src: '依恋理论：积极互动' },
            { text: '庆祝对方的光荣，就像在庆祝自己的——这不是比较，是你们成为了一个团队。', exp: '安全型伴侣在关系中的自我-他人重叠度适度偏高，他们能在不丧失个人边界的前提下真心为对方高兴。这种“你的胜利就是我的胜利”的感觉，是健康依恋的一种表现。', src: '依恋理论：共同认同' },
            { text: '你们的笑声是这段关系最悠扬的背景音乐，它是不能被设计的，只能自然发生。', exp: '自发性的共鸣反映了关系中的皮质醇水平足够低——压力和焦虑没有抢夺你们的乐趣。你们的神经系统建立在相对的安全中，这是关系质量的重要指标。', src: '依恋理论：心理生理安全' },
            { text: '别小看这时候的一个拥抱或一次击掌，它在身体上确认了“我们在一起”。', exp: '安全型依恋会通过身体接触来强化情感连接——“触觉亲和力”在快乐时刻尤其有效，它能把转瞬即逝的高光刻进身体记忆。', src: '依恋理论：身体接触' },
            { text: '记得告诉对方，你为ta高兴的具体原因——不是泛泛的“你真棒”，而是“你那个地方处理得真好”。', exp: '精确的肯定反映出你深入地关注对方，这在焦虑型依恋者那里尤其重要——它能减少“他只是随便夸夸”的怀疑。', src: '依恋理论：精确化肯定' },
            { text: '快乐被共享时，它就不再只是一个时刻，而变成你们之间的一个故事。', exp: '叙事依恋研究指出，共享的正面故事会沉淀在关系的历史中，成为日后困难的缓冲剂。你们今天在存一笔快乐资本。', src: '依恋理论：叙事存储' },
            { text: '你发现了吗？在开心的时候，你第一想要分享的人就在这里——这本身就很值得庆祝。', exp: '在依恋体系中，你的“快乐分享指向”是一个极强的信号——你主动选择了对方作为快乐的第一中转站，这反映了你在关系中的安全感。', src: '依恋理论：分享指向' },
            { text: '我们的庆祝不需要完美，甚至可以有点笨拙，但那又怎样呢——是我们一起在笑。', exp: '安全型依恋最不怕的就是不完美，因为它不依靠表现来维持。放松的、不完美的庆祝恰恰证明你们的关系不需要伪装。', src: '依恋理论：安全即自然' }
        ],
        tired: [
            { text: '跟对方说声“我好累”，这不是打搅，是递过去一份信任。', exp: '安全型依恋允许“安全基地”的使用——在疲惫时寻求伴侣的安抚不是弱点，而是正常依恋系统的激活。回避型会觉得这是负担，焦虑型怕被拒绝，但你完全可以把它当成一件事:我需要，所以我开口。', src: '依恋理论：安全基地' },
            { text: '累了不用装，伴侣之间有波谷也有波峰，这才是真日子。', exp: '安全型伴侣关系的特点是“情感协调”——你们不需要始终同步，但能识别并尊重对方当下的状态。疲惫时不强撑，快乐时尽情分享，这种灵活的协调本身比时刻开心更有价值。', src: '依恋理论：情感协调' },
            { text: '要是你们今天都累了，点个外卖，放着对方的节目不看，各自发呆——这也是一种亲密。', exp: '回避型或安全型都可以接受这种“平行存在的亲密”——既在一起又各自独立。这对于充电型的内倾伴侣尤其重要。', src: '依恋理论：平行存在' },
            { text: '你累的时候，ta有没有主动问一句“要我帮你做点什么”？如果有，你就被爱着。', exp: '安全型和部分焦虑型伴侣会通过工具性支持来回应伴侣的疲惫，这是爱的五种语言中“服务的行动”的体现。它传递的信息是：你的负担我来分担一点。', src: '依恋理论：工具性支持' },
            { text: '即使只是说一句“我知道我现在帮不了你什么，但我就坐在这里”也比假装没看见要好。', exp: '很多时候疲惫者并不需要解决方案，只需要“情感验证”——有人确认他的状态是合理的。这种在场本身就有调节焦虑的作用。', src: '依恋理论：情感验证' },
            { text: '如果你是那个此刻不累的人，给对方倒杯水，别多说，只是倒杯水。', exp: '无语言的支持对疲惫中的伴侣最不具侵入性。它表达了关注但没有施加倾诉的压力，尤其适合对方是回避型或处于超负荷状态时。', src: '依恋理论：无声支持' },
            { text: '如果你们最近都累，那就把要求降低，房子可以乱一点，计划可以缓一点——你们俩都没坏。', exp: '关系中的“外部压力”时期尤其需要把内部的完美标准降低。相互宽容是安全型关系的弹性来源，它不是下降，是为生存留出空间。', src: '依恋理论：压力期宽容' },
            { text: '累了就容易话不好听，如果谁说了什么冲的，先晾两分钟，那不是真心。', exp: '疲惫时认知资源和情感调节能力都下降，依恋系统的下行反应可能导致易怒或退缩。短暂的“暂停”协议可以避免伤害累积。', src: '依恋理论：暂停协议' },
            { text: '如果对方累到不想说话，你的任务就是克制自己想说话的心。', exp: '焦虑型伴侣容易在对方沉默时试图引起沟通，但这会加重对方的负荷。尊重沉默，是练习依恋安全感的行为之一——相信沉默不等于疏远。', src: '依恋理论：容忍沉默' },
            { text: '床就是你们的充电站，今晚早点窝进去，天塌了明早再撑。', exp: '共同就寝是一种基础的依恋行为——在无意识层面传达“我们在一起是安全的”。这种原始的信号比任何语言都更深入。', src: '依恋理论：共眠安全' }
        ],
        anxiety: [
            { text: '现在可以直接说“我需要点确认”，不丢人，这比憋着猜好一百倍。', exp: '焦虑型依恋的过度激活策略会让人旁敲侧击以求安慰。安全型的表达是直接说出需求——这不仅不会推远对方，反而给对方一个明确的“可以帮你”的信号，减少双方的情绪消耗。', src: '依恋理论：需求表达' },
            { text: '你是不是开始翻聊天记录找线索了？停一下，先去问问对方，别让大脑编剧本。', exp: '焦虑型依恋在感知到潜在威胁时，会自动进入“过度激活”模式:不断扫描可能的拒绝信号。打断这个模式的最佳方式不是继续寻找证据，是用行动(询问)替代反刍——把内部的不确定变成外部的可回答的疑问。', src: '依恋理论：过度激活策略' },
            { text: '你今天的不安可能不是他做了什么，而是你过去的记忆被激活了。提醒自己“现在是现在”。', exp: '焦虑型依恋的内部工作模型常将过去被忽视的经历投射到现在。区分“事实”和“记忆反刍”，是自我调节的第一步。', src: '依恋理论：投射区分' },
            { text: '如果你觉得自己在不停地索要安全感，可以试试直接要求一个具体的安抚——一个拥抱，或一句承诺。', exp: '焦虑型需要的不是抽象的保证，而是可触摸的回应。具体化你的需求，也让对方知道如何有效地爱你，避免了对方无力感。', src: '依恋理论：具体化需求' },
            { text: '对方没有秒回，最大的可能性不是讨厌你，是目前手上有事。把那个最坏的可能先放一边。', exp: '焦虑型容易把中性事件解读为拒绝信号。认知干预:列举三种“ta没回复”的可能原因，其中至少两个是中性的，这能降低情绪反应。', src: '依恋理论：中性化解读' },
            { text: '你的焦虑其实说明你很在乎这段关系，现在试着把这份在乎转成“我信你”，哪怕只是五分钟。', exp: '焦虑型依恋的高在乎是天生的，但需要学会把“害怕失去”转化为“相信拥有”。哪怕只是短暂的信任练习，都能打破焦虑循环。', src: '依恋理论：信任操练' },
            { text: '如果对方愿意在你焦虑时回应你，他不是在纵容你，是在帮你重写体验。', exp: '安全型伴侣的稳定回应是在帮助焦虑型修正内部工作模型——这不是依赖，是矫正性的情感体验，是治愈。', src: '依恋理论：矫正性情感体验' },
            { text: '有时候焦虑是你们关系里“未完成对话”的提醒——是不是有什么重要的事还没说开？', exp: '焦虑有时是直觉在提示一个未解决的议题，而不是空穴来风。不妨问问自己:焦虑下面是不是压着一个真正需要沟通的话题？', src: '依恋理论：焦虑作为信号' },
            { text: '当你感到不安时，试着区分：这是对失去他的恐惧，还是对失去自我价值的恐惧？两者常常缠在一起。', exp: '依恋焦虑常与自尊问题混合。分开这两个维度，你能更清楚地看到需要处理的是关系问题，还是个人成长议题。', src: '依恋理论：焦虑与自尊' },
            { text: '你也可以和伴侣建立一个“安全词”，当一方开始焦虑时，就说出这个词，意味着“我现在需要确认，不是指责”。', exp: '安全词是一种预先约定的沟通工具，能跳过防御，直接进入支援模式。它适用于任何依恋类型的伴侣，是极其实用的冲突缓冲器。', src: '依恋理论：安全词' }
        ],
        sadness: [
            { text: '在对方这里，你可以是不完美的。这颗心，就是留给难过的你歇脚的。', exp: '安全型伴侣能提供“容纳环境”——一个可以安全地表达脆弱而不必担心被评判的空间。在依恋理论中，这种体验能直接修复之前因不安全依恋造成的“情感不可表达”的信念。', src: '依恋理论：容纳环境' },
            { text: '难过的时候想想，这段关系里你不需要独自扛着。', exp: '安全型依恋的核心好处之一是“共同调节”——原本需要一个人处理的大量情感负担，可以通过和信任的人待在一起而被分担。你不说，对方也能感知一部分；你说了，对方会承接更多。', src: '依恋理论：共同调节' },
            { text: '你难过的时候，对方可能不知道说什么，但只要ta没走，就已经在表达了。', exp: '有时候支持不需要完美的语言。在场本身是依恋安全的最大信号。如果对方是不善于言辞的类型，他的“没走”就是他的情话。', src: '依恋理论：在场即支持' },
            { text: '别因为自己难过就觉得拖累了对方。爱包含了愿意一起经过暗处。', exp: '焦虑型依恋容易在难过时产生“我不该这么麻烦”的想法。但安全型或愿意成长的关系会把这种分担视为亲近的契机，而不是负担。', src: '依恋理论：允许分担' },
            { text: '如果你不想说，就告诉他“我很难过，但现在不想说，陪我待一会就好”。这也是清晰的沟通。', exp: '明确自己的需要并清晰传达，是安全依恋行为的表现。即使只是需要无言的陪伴，表达出来也能让伴侣知道如何回应。', src: '依恋理论：需求清晰化' },
            { text: '为对方难过的时候，别急着给建议，很多时候他只需要一只耳朵，不是一张嘴。', exp: '支持的最佳方式往往是“情感协调”——先连接情绪，后解决问题。过早提供解决方案会跳过对方需要被理解的那一步。', src: '依恋理论：共情优先' },
            { text: '你的眼泪不会冲走你们的亲密，反而会把它变得更真。', exp: '脆弱性的展现在亲密关系中是一个转折点，它测试关系是否足够安全。如果对方承受住了，你们的关系就会更深一层。', src: '依恋理论：脆弱测试' },
            { text: '如果对方在哭，你的手放上去，比许多话都管用。', exp: '身体接触能够在情感痛苦时提供直接的安全信号，它绕过了语言处理，直达情绪脑，能迅速降低压力激素。', src: '依恋理论：触觉安慰' },
            { text: '悲伤被分享之后不会减半，但会变得不再那么锋利。', exp: '分担痛苦并非数学上的减半，而是通过获得另一个心灵的见证，将孤立无援的痛苦转化为被理解的伤痛，其撕扯感会显著下降。', src: '依恋理论：共同承载' },
            { text: '有时你的伴侣自己也正处在低谷，无法给你支撑。这时请明白，不是你不值得被安慰，而是他也需要时间恢复。', exp: '安全型依恋也承认伴侣的有限性。当对方无法提供情绪支持时，不是你的索求有错，而是两个人此刻的资源都有限。理解这一点，能避免对自己和关系的双重攻击。', src: '依恋理论：有限性的接纳' }
        ],
        lost: [
            { text: '我们不一定立刻找到答案，但可以一起站在原地多看一会儿。', exp: '安全型伴侣在面临不确定性时表现为“共同探索”——双方愿意在没有清晰目标的情况下保持在场，而不是一个人独自焦虑另一个人远离。这种共同面对本身就是对迷茫的解药。', src: '依恋理论：共同探索' },
            { text: '当你们都不知道往哪走的时候，就先照顾好今天。方向会在日常里悄悄显现。', exp: '迷茫期，共同照顾日常——一起做饭，散步，采购——这些仪式性的合作能重建安全感和协作感，为未来方向的出现提供稳定基底。', src: '依恋理论：日常合作' },
            { text: '我们可以把迷茫当作一个彼此更深了解的机会：你真正害怕的是什么？', exp: '迷茫常常与恐惧有关。伴侣若能在此时非评判地探讨彼此的恐惧，不仅能缓解焦虑，还能加深对彼此内部世界的理解。', src: '依恋理论：恐惧分享' },
            { text: '如果一方完全没方向，另一方却急，急的那方稍微压下速度。迷茫需要容错率。', exp: '关系中的节奏差异会引发依恋系统的摩擦——一方可能需要更多的安抚和等待。放慢脚步，是对伴侣心理现实的尊重。', src: '依恋理论：节奏协调' },
            { text: '你们可以试着把你们知道的不想要的东西写下来，然后一起对它们说再见。', exp: '共同列出“不要什么”是一个低风险的合作决策，能启动双方的决策功能，同时避免直接跳入还不清晰的“要什么”。', src: '依恋理论：合作决策' },
            { text: '有时候，迷茫是关系升级的前奏，它正在淘汰旧的模式，催生新的相处方式。', exp: '关系进入迷茫期往往是旧有的互动模式不足以应对新阶段的信号。如果你们能挺过这段混沌，新的、更适合你们现在的模式将会诞生。', src: '依恋理论：模式更迭' },
            { text: '别在迷茫的时候轻易做关于关系的重大决定，等雾散一点再说。', exp: '迷茫期判断力下降，尤其是依赖直觉或情感做决策的个体。给自己一个缓冲期，在情绪更平稳时再评估关系方向。', src: '依恋理论：决策缓冲' },
            { text: '我们可以暂时不想太远，就想想下周想一起做什么。短期的微光也能照亮眼前。', exp: '设定一个短期的共同小目标，能重新建立“我们是共同体”的感觉，并产生即时的成就感，为长期迷茫提供喘息空间。', src: '依恋理论：短期目标感' },
            { text: '迷茫的时候，两个人互相问“你现在感觉还好吗？”，比问“我们该怎么办？”更能抚慰彼此。', exp: '当方向不明，先去连接情绪，而非急于解决问题。情绪连接能创造安全感，在此之上，理智才更容易找到出路。', src: '依恋理论：情绪先于方案' },
            { text: '如果两个人都不知道未来会怎样，那至少可以约定，不管去哪里，我们都保持诚实和善良。', exp: '迷茫期的关系锚点是过程和品质，而非结果。承诺以善意相待，本身就是最稳固的指南针。', src: '依恋理论：过程承诺' }
        ],
        relationship: [
            { text: '你们之间有些冲突，不是不爱，是没找到对的路靠近。', exp: '很多关系冲突其实是依恋行为在误译——一方用抗议(焦虑型)表达需要，另一方用后退(回避型)表达独立。这不是爱的缺失，是接近方式的错配。识别出这个模式，你们就开始了真正的交流。', src: '依恋理论：依恋行为误译' },
            { text: '那些反复吵架又和好的事，其实在提醒你们:这里有个没被看见的需求。', exp: '依恋理论把反复冲突视为“稳定僵局”——表面是不断循环的争吵，底层是某种依恋需求(被确认、被尊重、被让出空间)从未真正被对方听到。看见这个需求本身，就能让僵局松动。', src: '依恋理论：依恋需求识别' },
            { text: '如果每次吵架的模式都一样，那这很可能不是今天的事，是很久以前的事在借今天的嘴说话。', exp: '很多关系冲突是过去依恋创伤的“移情”——你把对早期照料者的期待或恐惧投射到伴侣身上。识别出这种模式，能将争吵提升为疗愈的契机。', src: '依恋理论：移情' },
            { text: '有时候你们需要的不是解决问题，而是承认“我知道这对你很重要”。', exp: '在许多冲突中，被理解比被解决更重要。简单的承认能让对方的依恋系统安静下来，因为被听到已经是关键需求之一。', src: '依恋理论：承认需求' },
            { text: '如果你总是那个让步的人，想一想，你是在维护关系，还是在慢慢消失？', exp: '焦虑型或恐惧型容易过度妥协以维持连接，但长期会侵蚀自我。把“自我保持”也作为一个正当的需求，是关系健康的一部分。', src: '依恋理论：自我保持' },
            { text: '给彼此留一点空间，不是疏远，是让你们各自都能呼吸，然后更好地回来。', exp: '回避型需要空间来管理焦虑，安全型也需要独立时间来充电。尊重对方的独处需要，是成熟依恋的标志。', src: '依恋理论：尊重空间' },
            { text: '你们可以试试这样争吵:轮流说，不打断，说完之后重复一下对方说的，验证自己听懂没有。', exp: '这是一个高安全度的冲突解决工具，迫使双方启动共情和认知理解，而不是情绪反应。它重建了对话的基本安全。', src: '依恋理论：结构化对话' },
            { text: '千万别在吵架的时候翻旧账，那些旧账是以前那个时间点的情绪，不是这次的。', exp: '翻旧账会激活过去的依恋创伤，让当前的冲突变成一场关于历史的官司，而不是解决此时此地的事件。', src: '依恋理论：就事论事' },
            { text: '关系中的安全感不是从不吵架，而是吵完架之后，你们还能一起安静地吃饭。', exp: '安全型依恋的关键是修复能力，而非冲突频率。如果能从冲突中回来，关系韧性就会不断增强。', src: '依恋理论：修复力' },
            { text: '定期问对方一个简单的问题：“这段时间，你觉得我们之间有什么需要调整的吗？” 提前量比事后弥补省力得多。', exp: '关系体检是预防性维护，而非出现问题才解决。它建立了一种共同的责任感和透明度，是安全型关系的日常实践。', src: '依恋理论：关系维护' }
        ],
        strive: [
            { text: '你们各自往前冲的时候，别忘了回头看一眼对方。共同的方向，比各自的速度更重要。', exp: '安全型伴侣在共同目标上表现为“相互支持”，但奋斗期容易让人专注各自领域而减少情感投注。主动的“回头看”是维持关系安全感的小仪式——它告诉对方:忙归忙，你没被挤到生活的边角。', src: '依恋理论：奋斗期安全感维护' },
            { text: '如果你们在为共同的将来努力，那么过程里的苦都带着甜，只是别让其中一个独自承担。', exp: '共享目标可以增强关系凝聚力，但需要确保努力的分配是公平的，否则可能产生怨恨。定期检查分担，是安全型关系维护的常规操作。', src: '依恋理论：公平分担' },
            { text: '你努力的时候，别忘记告诉对方你需要怎样的支持——是听你抱怨，还是给你安静。', exp: '奋斗期需求必须明确表达，因为伴侣无法自动知晓。清晰的请求能防止因期待落空而产生不必要的冲突。', src: '依恋理论：支持需求明确' },
            { text: '你们两个都累的时候，可以申请一个“奋斗假期”吗？哪怕只有一晚，全世界暂停。', exp: '为关系设置明确的“不奋斗时间”，能防止两个人的心理能量同时耗竭。这是战略性恢复，也是关系的充电站。', src: '依恋理论：策略性休息' },
            { text: '即使再忙，也要保留一个小小的连接习惯——一句早安，一个睡前讯号。', exp: '在奋斗期维持微小的连接仪式是防止情感疏远的关键。这些仪式像小锚点，确保关系之船不漂太远。', src: '依恋理论：微连接' },
            { text: '如果有一方暂时落后，另一方不要催，等等ta。你们的队伍因着互相等待而变得不可替代。', exp: '共同体的本质是在速度差中保持耐心。这种等待是对关系和伴侣价值的确认，能增强双方的归属感。', src: '依恋理论：等待即确认' },
            { text: '当你们一起完成一件大事，别忘了互相说“这是我们做到的”，而不是只有“我”。', exp: '共同归因成功能加强共同身份。使用“我们”而不是“我”，是在重新加工你们的关系叙事，加固共同体感觉。', src: '依恋理论：共同归因' },
            { text: '奋斗目标可能变，但你们的关系是那个不变的地基。只要地基在，上面盖什么都行。', exp: '关系是奋斗的安全基地。当目标受挫时，关系本身作为锚点的作用就凸显出来。强调关系优先于具体目标，能减少失败对两人的冲击。', src: '依恋理论：关系优先级' },
            { text: '你们各自的成长，也是这段关系的成长。一个变得更强的你，能给关系带来新的资源。', exp: '个体发展与关系发展并非零和，而是相互滋养。当双方都致力于自我提升时，关系会自然进化到更丰富的层次。', src: '依恋理论：个体化与关系' },
            { text: '你们可以一起规划未来的财务、事业，但同时要记得规划未来的快乐——明年想去哪里旅行？', exp: '长期规划若只有责任没有乐趣，会变得沉重。把共同享乐也放入计划，不仅能减压，还能提升对共同未来的期待感。', src: '依恋理论：共同乐趣规划' }
        ]
    },
    parent: {
        celebration: [
            { text: '看到孩子的好，也别忘了这里头有你的好——这园子是你浇的水。', exp: '阿德勒指出，父母对孩子的成就倾向于“自然归因于孩子”，却很少合理地将部分成果归因于自己的养育投入。适度的自我认可不是抢功，是健康的“共同体感”——你在为家庭系统的繁荣感到真正的满足。', src: '阿德勒：共同体感' },
            { text: '这一刻不用想教育，单纯为孩子高兴就行。', exp: '武志红强调，中国式家庭常常把每一个幸福时刻都转化为“教育的契机”，这会让亲子关系退化为教育关系。允许一个纯粹的、不承载任何教育功能的快乐时刻，是修复关系质量的重要动作。', src: '武志红：关系vs教育' },
            { text: '孩子此刻的眼睛里全是光，你现在是谁？不是老师，不是教练，就是这个笑容的守护者。', exp: '武志红认为，父母的角色需要灵活切换。在成功时刻，做一个纯粹的见证者和欣赏者，能给孩子提供“我被无条件地喜爱”的证据。', src: '武志红：角色灵活切换' },
            { text: '别急着把这好成绩发朋友圈，先蹲下来告诉孩子：你为自己骄傲吗？我很为你骄傲。', exp: '阿德勒鼓励把评价权先还给孩子，然后再给予父母的肯定。这样顺序能建立孩子的内在标准，而不是外部依赖。', src: '阿德勒：自我评价优先' },
            { text: '庆祝的时候，重点不在于孩子做了什么，而在于他是什么样的人——努力的人，好奇的人。', exp: '阿德勒心理学强调表扬努力和特质，而不是结果。这培养的是成长型思维和健康的自我价值感，不依赖下一次的成绩。', src: '阿德勒：特质表扬' },
            { text: '快乐如果被允许彻底体验，它就是孩子内心里永远的光。你不是在浪费教育时间，你是在储存心理能量。', exp: '武志红指出，一个被允许彻底快乐的孩子，成年后更不易陷入抑郁。因为那些纯粹的快乐体验会成为他日后对抗虚无的内部资源。', src: '武志红：快乐即资源' },
            { text: '今天可以破例：冰淇淋当晚饭，或者晚睡半小时。规则偶尔让位给庆祝，不会惯坏孩子，会教会他生活的弹性。', exp: '弹性是心理健康的表现。在特殊时刻打破常规，让孩子学习到生活不是僵硬的，而是可以随着喜悦起舞的，这本身就是重要一课。', src: '武志红：规则的弹性' },
            { text: '笑是会传染的，和你一起大笑的孩子，以后也会是一个能让别人笑的人。', exp: '情感模式具有代际传递性。父母在庆祝中的积极情感表达，是孩子学习如何快乐、如何分享快乐最直接的模板。', src: '代际传递：情感模式' },
            { text: '你们全家人的笑声，是这个家永远不会贬值的财富。', exp: '家庭的积极情绪氛围是孩子心理健康的保护性因素。它构建了一个内部的“安全港湾”，让孩子知道无论外面如何，这里都有笑声等着他。', src: '阿德勒：家庭氛围' },
            { text: '你小时候是不是很少被这样纯粹地庆祝过？那现在就和孩子一起，也为你自己补上。', exp: '武志红多次提到，父母可以通过满足孩子的健康需求来同时抚慰自己的内在小孩。在庆祝孩子的同时，你也在庆祝曾经渴望被看到的那个自己。', src: '武志红：双重疗愈' }
        ],
        tired: [
            { text: '带娃带到崩溃，这是正常的，不是你不够好。', exp: '育儿消耗不是意志薄弱，是真实的生理和心理损耗。武志红在《家为何伤》中反复强调:父母需要被允许说累、被允许有极限，否则愧疚感会把疲惫加倍，变成一种对自我的隐性攻击。', src: '武志红：父母自我允许' },
            { text: '如果你现在一点温柔都提不起来了，那就先把孩子安全地放在一边，给自己十分钟。', exp: '阿德勒儿童教育心理学指出，亲子互动质量的核心不是时间长短，而是父母的情绪状态。在愤怒或枯竭状态下强行互动，弊大于利。短暂分离是保护关系不被破坏的智慧策略，不是逃避。', src: '阿德勒：互动质量' },
            { text: '今天当个“差不多”的父母就行，剩下的电量留给你自己。', exp: '武志红提出“够好的父母”概念。你不需要时刻完美，只需要在关键时候“在场”。允许自己在非关键时刻走神、躺平，是对自己人性的接纳。', src: '武志红：足够好' },
            { text: '你的累有一部分是精神上的“哨兵疲劳”——你一直在半警觉地听着孩子的动静。这不是娇气。', exp: '父母，尤其是母亲，长期处于一种“警惕性照顾”状态，这种持续的注意力分派会诱发慢性疲劳。认识到这一点，你会理解为什么有时只是“待命”就已精疲力尽。', src: '心理学：警戒性照顾' },
            { text: '跟伴侣说“接下来两小时我需要关机”，这不是推卸责任，是让责任可持续。', exp: '阿德勒强调合作育儿中的责任轮换。明确的界限和轮班能防止一方耗竭，并给孩子展示了亲密关系中互助与边界共存的正常模式。', src: '阿德勒：合作育儿' },
            { text: '你不需要在累的时候还想着开发孩子的智力，他看你懂得休息，比多背一首诗有用。', exp: '武志红指出，孩子学的是父母如何对待自己——你如何休息、如何照顾自己，是孩子未来自我关怀的原始蓝图。', src: '武志红：自我关怀样板' },
            { text: '微波炉转出来的晚餐、没收拾的玩具、没讲完的故事——都行。你今天最重要的事是存活。', exp: '降低标准是为了保存生命力和关系。阿德勒认为，家庭秩序服务于人，而非人服务于秩序。在极度疲惫时，秩序的优先级必须下调。', src: '阿德勒：秩序灵活性' },
            { text: '如果你累得想吼，试着用最小的声音把他叫过去，或者自己先躲进卫生间淋一小会儿热水。', exp: '当生理资源耗尽时，人会退行到最原始的应激模式。用感官安抚（水声、温暖）来打断即将爆发的吼叫循环，是一种有效的行为中断法。', src: '武志红：中断吼叫循环' },
            { text: '你可以跟孩子坦白：“妈妈/爸爸现在非常累，需要安静一会儿，十分钟后我再来陪你。” 这不会伤害他，会教他尊重他人边界。', exp: '对孩子适度表露真实状态，并建立可预测的“回归”承诺，既为孩子提供了情感教育，又保护了父母自己的心理空间。', src: '阿德勒：诚实与边界教育' },
            { text: '别忘了，疲惫的父母也是曾经那个需要照顾的孩子。偶尔，你也得做自己的家长。', exp: '武志红强调，当父母的内在小孩没有被照顾时，很难持续输出关爱。自我关怀是保持育儿能力的必要前提。', src: '武志红：内在小孩' }
        ],
        anxiety: [
            { text: '你当下对孩子的担心，可能有一部分来自你小时候经历过的紧张。', exp: '武志红多次指出“代际创伤传递”——父母自身的焦虑往往不是对当下孩子的反应，而是自己童年时期被苛责、被忽视或不被允许犯错的惊恐记忆被激活。分清“这是谁的情绪”，是阻断传递的第一步。', src: '武志红：代际创伤传递' },
            { text: '不是所有问题都需要今天解决，孩子成长的时间，比你想象的充足。', exp: '阿德勒指出，父母常因“虚构目的论”而焦虑——他们为自己虚构了一个完美的育儿时间表和结果，然后不断追赶。放下这个虚构的进度条，看到孩子真实的发展节奏，焦虑会自然消退大半。', src: '阿德勒：虚构目的论' },
            { text: '你担心孩子的未来，这很正常。但先区分：是孩子在危险中，还是你在想象中的危险里？', exp: '焦虑型父母常常将遥远的、低概率的负面可能性当成迫在眉睫的威胁。区分真实风险和焦虑幻想，是保护自己和孩子不受无谓情绪消耗的关键。', src: '武志红：分清幻想与现实' },
            { text: '你今天对孩子发的火，可能只是因为你累了、你担心、你需要支持——不是孩子真做了什么不可原谅的事。', exp: '武志红指出，父母的负面情绪很多时候是被自己的未满足需求所触发，孩子只是导火索。识别真正的压力来源，能避免把孩子妖魔化。', src: '武志红：情绪来源识别' },
            { text: '别人家孩子的“成功案例”和你无关。你的孩子有自己的成长时区，你也是。', exp: '社交比较是父母焦虑的重要来源。阿德勒指出，健康的共同体感不是横向比较，而是纵向看到每个人的独特性和进步。停止比较，你才能看见眼前这个真实的孩子。', src: '阿德勒：横向比较陷阱' },
            { text: '如果你一直紧张孩子的一举一动，试着把目光从他身上移开十分钟，看看窗外，看看你自己。', exp: '过度关注（直升机教养）会增加孩子的焦虑。短暂的“注意力撤回”在给孩子空间的同时，也让父母从紧绷的监控状态中脱离，恢复一丝平静。', src: '阿德勒：给予空间' },
            { text: '你和孩子都需要犯错的许可。如果你能在他犯错后抱住他，而不是先去纠正，你已经赢了大部分父母。', exp: '武志红强调，家应该是犯错后第一个可以回去的地方，而不是需要躲藏的地方。父母的第一反应不是教育，而是接纳，这能建立孩子终生的安全感。', src: '武志红：接纳错误' },
            { text: '当你为孩子的某个行为焦虑时，问问自己：这个行为在二十年后真的还重要吗？', exp: '用长焦镜头看问题，能有效缩小当下的焦虑感。很多当下的困扰在时间的长河中是微不足道的，这帮助我们抓大放小。', src: '阿德勒：时间视角' },
            { text: '你的镇定是孩子最好的抗焦虑药。如果你能稳住自己，孩子的世界就不会摇晃得太厉害。', exp: '父母是孩子情绪调节的外部设备。当父母能够自我调节时，孩子能从中借用到稳定感，减少其自身的焦虑水平。', src: '武志红：父母的镇定功能' },
            { text: '允许自己对孩子的未来保持合理的担心，但不要让这份担心成为你们之间唯一的沟通内容。', exp: '焦虑会窄化交流，如果每天只谈学习和问题，孩子会感到被物化。确保每天有至少一次不涉及“督促”的聊天，保持情感连接。', src: '阿德勒：多样化交流' }
        ],
        sadness: [
            { text: '当父母的过程里，有些失落是真实的，不用对自己撒谎说一切都值。', exp: '武志红强调，成为父母伴随着大量的丧失:个人时间的丧失、自由感的丧失、从前身份的丧失。否认这些失落，会让它们变成对孩子的隐性怨恨。承认“我失去了一些东西”，才能腾出空间来爱“我得到的东西”。', src: '武志红：承认丧失' },
            { text: '你可以在孩子看不见的地方哭一场。你的悲伤和你的母爱并不冲突。', exp: '许多父母认为在孩子面前必须永远坚强，但压抑悲伤会转化为身体的紧张或莫名的烦躁。找一个安全通道释放悲伤，是为了更好地返回。', src: '武志红：悲伤的出口' },
            { text: '如果你为孩子的事难过，问问自己：这是真的在为他难过，还是在为你自己小时候那个不被理解的小孩难过？', exp: '武志红指出，父母有时无法区分自己的创伤和孩子的痛苦。当你过度共情时，可能需要先处理自己的旧伤，这样才能以一个更清明的状态支持孩子。', src: '武志红：创伤区分' },
            { text: '你看孩子画的一幅画，听他说的一句话，可能突然就触动了你心里某个柔软的地方，你哭了。这很好，你还有柔软。', exp: '被孩子触动而引起的情感波动，是父母与内在孩子连接的时刻。它说明你的感受系统没有被育儿事务完全钝化，是生命力尚存的标志。', src: '武志红：柔软的力量' },
            { text: '如果孩子过得不好，你当然会难过。但你得站住了，你的稳定是他唯一的救生圈。', exp: '阿德勒指出，父母的情感稳定性是孩子面对外部风浪时的安全基地。你可以难过，但同时必须保持功能，成为他可以依靠的岛。', src: '阿德勒：稳定岛' },
            { text: '你的眼泪教会孩子，悲伤是可以被允许的，不用藏起来。', exp: '父母合适的情感表露是孩子情绪教育的范本。当孩子看到你的悲伤被接纳和处理，他也学到了如何处理自己的悲伤。这是更重要的情绪课。', src: '武志红：情绪示范' },
            { text: '孩子受挫时，你可能比他更难过。这份共情是你的天赋，但注意别把他的功课背在自己身上。', exp: '过度的共情会导致界限模糊，使孩子失去自己处理情绪的空间。保持关心但不越位，是阿德勒提倡的课题分离在亲子关系中的应用。', src: '阿德勒：课题分离与共情' },
            { text: '内疚感是许多父母如影随形的伴侣，但你不能总用内疚来鞭策自己。你已经很努力了。', exp: '有毒的内疚感源于不切实际的完美标准。武志红强调，父母需要从“我应该”中解放出来，转向“我可以”，接纳自己的局限性。', src: '武志红：去除有毒内疚' },
            { text: '看到孩子在经历你童年类似的痛苦时，无力感会加倍。告诉自己：我不是当年的父母，孩子也不是当年的我。', exp: '区分过去和现在，是截断代际创伤的关键。你有机会提供不同的回应，书写不同的结局。', src: '武志红：代际区分' }
        ],
        lost: [
            { text: '做一个“够好”的父母就够了，不用当完美的。孩子其实不需要一百分的家长。', exp: '阿德勒非常强调“足够好”的概念取代“完美父母”——孩子并不需要一个永远正确的人，需要一个真实、会犯错也会道歉、能在关系破裂后主动修复的人。迷茫说明你在反思，而反思本身已经是够好的证明。', src: '阿德勒：足够好的父母' },
            { text: '教育的方法千千万，但能持续影响孩子的，是你真实的样子。', exp: '武志红指出，孩子内化的不是父母的说教，是父母的“存在方式”——你如何处理挫败，如何表达情感，如何对待一个人。在迷茫时，你试图寻找怎么做，但孩子此刻在学的是:一个人如何面对不知道怎么做。', src: '武志红：存在的影响' },
            { text: '如果你对当前的教育方向感到迷茫，不如回到最简单的事：每天让孩子有几次开心大笑的机会。', exp: '阿德勒认为，幸福的基础是“共同体感觉”，而家庭中快乐和放松的氛围是共同体感觉的土壤。当你不知道对错时，先保证快乐。', src: '阿德勒：快乐为基础' },
            { text: '你可以不知道如何回答孩子的问题，你可以跟他一起查，一起学——这就是最好的学习态度。', exp: '父母表现出“不知道但愿意去找答案”的姿态，比假装知道更好。这会传递给孩子一种健康的求知模式，并减轻自己的无所不能负担。', src: '武志红：共同学习者' },
            { text: '有时候你需要放弃某种教育理论，让自己只根据孩子的眼神和呼吸来判断。', exp: '所有理论都抵不过真实的观察。过度依赖理论会让你忽略孩子发出的独特信号。回到你的直觉，也许比任何一本书都更能告诉你孩子需要什么。', src: '武志红：直觉育儿' },
            { text: '育儿没有标准答案，每个家庭都有自己的“小气候”。你的迷茫恰巧说明你在认真思考，而不是机械照搬。', exp: '标准化育儿观带来的压力是巨大的，认识到个体差异并尊重它，是摆脱迷茫和外界批判的起点。', src: '阿德勒：个体心理学' },
            { text: '你不需要马上解决孩子的所有问题，先让自己感觉好一点。父母状态好，问题往往也就变小了。', exp: '父母的情绪是家庭的底色。当你照顾好自己的状态，很多看似的育儿难题会因为你的平和而自然化解或不再显得棘手。', src: '武志红：家庭情绪场' },
            { text: '感到迷茫时，可以和你的伴侣或者一个值得信赖的朋友聊聊，哪怕只是说“我不知道该怎么办了”。', exp: '育儿不应该是孤岛。寻求支持是力量和智慧的表现，而不是软弱。共同体感觉也包括父母之间的互相扶持。', src: '阿德勒：寻求支持' },
            { text: '或许你迷茫是因为你正在意识到，你不必重复上一代的教育模式。这份迷惘，是新路的开端。', exp: '觉醒往往伴随着不知所措。当你意识到旧模式可能不对，但新模式尚未建立时，正是改变发生的地方。', src: '武志红：觉醒与重构' }
        ],
        relationship: [
            { text: '你们夫妻之间的相处方式，是孩子正在默默吸收的怎么跟人相爱和争执。', exp: '武志红强调，孩子是在父母的婚姻样本中学习亲密关系的——他们吸收的不是道理，是“冲突时如何处理”、“快乐时如何分享”、“脆弱时如何相待”的活生生的模板。你们不必完美，但需要让孩子看到修复。', src: '武志红：婚姻样本' },
            { text: '如果不自觉地用你爸妈当年对你的方式对孩子，别慌——你意识到了，改变就开始了。', exp: '阿德勒指出，家庭模式代际复制的前提是它的“无意识性”——我们自动重复熟悉的东西，哪怕它是坏的。一旦你觉察到“我正在用当年被对待的方式对待我的孩子”，你就已经从这个循环里撕开了口子。', src: '阿德勒：代际模式觉察' },
            { text: '你们夫妻之间如果能当着孩子说“爸爸妈妈刚才吵了架，现在我们和好了，我们依然爱你”，这会比任何说教都有力量。', exp: '武志红强调，修复比不吵架更重要。向孩子展示冲突后的修复过程，是教给孩子如何处理关系破裂和重建，这是最深刻的情感教育。', src: '武志红：修复示范' },
            { text: '如果你们在孩子面前意见不一，不要一个红脸一个白脸。私下统一后，再一起跟他谈。', exp: '阿德勒认为，父母教育的一致性比具体方法更重要。分裂的教育阵线会让孩子混淆，并可能操纵父母。共同决定，共同承担。', src: '阿德勒：教育一致性' },
            { text: '孩子的“问题行为”常常是在表达一个家庭关系中的未解之结。你们的关系越和谐，孩子的症状通常越轻。', exp: '家庭系统理论认为，孩子往往承载着家庭系统的焦虑。改善夫妻关系或亲子互动模式，许多孩子的“问题”会迎刃而解。', src: '武志红：家庭系统观' },
            { text: '你不需要在孩子面前扮演完美的伴侣。偶尔的拌嘴、道歉和妥协，是更真实的关系示范。', exp: '孩子需要学习关系并非童话，而是由两个不完美的人共同创造的。真实的关系动态比完美的形象更有教育意义。', src: '武志红：真实的关系示范' },
            { text: '别忘了在关系中补充情感燃料。定期安排二人世界，哪怕只是散步，你们的关系不是只靠育儿来维系。', exp: '夫妻关系是家庭的定海神针。当伴侣关系被充分滋养，整个家庭系统的功能会更加顺畅，孩子也会从中受益。', src: '阿德勒：夫妻优先' },
            { text: '如果你对伴侣的育儿方式有看法，试着用“我观察到…我感觉…”来表达，而不是指责。', exp: '非暴力沟通方式在育儿合作中至关重要。它能降低防御，聚焦于共同为孩子好的目标，而不是相互攻击。', src: '阿德勒：合作性沟通' },
            { text: '你们是第一次为人父母，彼此都是新手，可以对对方多一点耐心，就像对待正在学习走路的孩子一样。', exp: '将同理心延伸到伴侣身上，理解彼此都在学习，能极大减少夫妻间的摩擦，共同面对育儿挑战。', src: '武志红：对伴侣的同理心' }
        ],
        strive: [
            { text: '你为孩子努力的样子，他们其实都看在眼里。重要的是，让孩子看见的是一个在努力的人，不是一个在牺牲的人。', exp: '阿德勒把“自我牺牲”和“社会贡献”区分得非常清楚——前者是对孩子的情感绑架(“我都是为了你”)，后者是让孩子亲眼看到一个成年人如何在世界上投入地生活。你要给孩子的不是一个牺牲品，是一个榜样。', src: '阿德勒：牺牲vs贡献' },
            { text: '你不必为孩子铺平所有的路，你只需做个在前面走的人，让他看见你的背影就知道怎么往前走。', exp: '榜样教育比说教强一百倍。你的努力、你的坚持、你如何处理挫折，是孩子最鲜活的教材。你不需要完美，只需要真实地在走。', src: '阿德勒：榜样的力量' },
            { text: '在为孩子提供物质基础的同时，别忘了给自己的精神世界留一块花园。一个有自己追求的父母，是孩子眼中的光。', exp: '武志红指出，父母保持自我成长和兴趣，能防止将全部期望压在孩子身上。一个活出自我价值的父母，是给孩子最好的礼物。', src: '武志红：父母的自我实现' },
            { text: '奋斗和陪伴并非对立。高质量的十分钟，远胜于心不在焉的一小时。', exp: '阿德勒认为，关系的质量重于数量。在你忙碌时，确保与孩子互动的时间是全神贯注的，孩子能感受到这份专注和爱。', src: '阿德勒：互动质量' },
            { text: '你是孩子的安全基地，你的奋斗是为了让这个基地更坚固，而不是让它变成空壳。', exp: '安全基地不仅需要物质基础，更需要情感在场。在追求事业的同时，要确保家庭的情感连接依然牢固。', src: '依恋理论：安全基地' },
            { text: '允许自己在某些阶段重心偏向工作，但要诚实告诉孩子，并规划好补偿的陪伴时间。孩子能理解你的。', exp: '坦诚和可预测性是关键。当孩子知道你的忙碌是暂时的且有回归的承诺，他们的安全感就不会受到根本动摇。', src: '武志红：透明化的家庭规划' },
            { text: '你的职业成就可能让孩子感到骄傲，但你的温暖和关注才是他内心富足的来源。', exp: '孩子的价值感更多来源于被爱的感受，而非父母的外部成就。确保在追求成就时，不牺牲掉表达爱的日常仪式。', src: '阿德勒：爱比成就更重要' },
            { text: '别忘了，你奋斗的初衷也许就是给孩子更好的生活。那么，现在更好的生活，包括更快乐、更放松的你们。', exp: '在追求未来的同时，不要牺牲当下的幸福。因为孩子的童年只有一次，你拥有健康快乐的当下，已经是给孩子最好的生活之一。', src: '武志红：当下的幸福' },
            { text: '和孩子分享你工作和奋斗中的小故事、小挫折，这会让他理解真实的世界，并学习如何面对困难。', exp: '这属于社会学习。父母敞开适当的工作世界，能帮助孩子建立职业认知和韧性，拉近亲子距离。', src: '阿德勒：社会学习' }
        ]
    },
    courage: {
        celebration: [
            { text: '恭喜你，你刚刚迈出了别人不敢的一步。这种感觉，先消化一下。', exp: '阿德勒在《被讨厌的勇气》中强调，任何一个新行为都值得被充分认识和庆贺——因为之前你选择了旧行为，它至少安全。新行为是你打败了旧的安全选择才出现的，这是勇气的实在证据。', src: '阿德勒：新行为的价值' },
            { text: '这份勇敢不是偶然，是你心底选择了对自己诚实。好好庆祝这份诚实。', exp: '勇气源于对内心真实需求的忠诚。庆祝它，就是强化“我可以选择真实”的信念。', src: '《被讨厌的勇气》：诚实与勇气' },
            { text: '今天你为自己做了一件事，不用管别人理不理解，你理解自己就够了。', exp: '课题分离：你的选择是你的课题，别人的理解是别人的课题。自我认可就是最大的奖赏。', src: '课题分离：自我认可' },
            { text: '哪怕只是一小步，也是从零到一的跨越。这一小步，值得你今晚加个菜。', exp: '阿德勒心理学注重“鼓励”而非“表扬”。为自己的进步主动庆祝，是对自己努力的最大尊重。', src: '阿德勒：自我鼓励' },
            { text: '敢去做一个以前想都不敢想的决定，这就是在改写你的人生剧本。', exp: '阿德勒认为，每个人都有创造性自我，可以重新定义生活风格。勇敢的行动是对旧剧本的改写。', src: '阿德勒：创造性自我' },
            { text: '不要和别人比勇气的含金量，你自己的战场只有你自己知道。', exp: '横向比较是勇气的杀手。你的勇气针对的是你自己的恐惧，分量只有你自己能衡量。', src: '课题分离：纵向比较' },
            { text: '告诉自己：“我做到了。” 简单五个字，是你给自己颁发的最真实的勋章。', exp: '自我确认是巩固新行为模式的重要环节，能增强自我效能感，为下一次挑战蓄力。', src: '阿德勒：自我效能感' },
            { text: '勇气是有声音的，那是生命在舒展自己的响动。你听到了吗？', exp: '荣格认为勇气是自性在个体化过程中的推力，是生命本能的表达。', src: '荣格：自性推动' },
            { text: '可以允许自己感到开心和骄傲，这些积极情绪是勇气的燃料，不是骄傲自满。', exp: '区分“骄傲”和“自豪”。为自己的行为感到骄傲，是健康的自恋，为下一次行动积蓄心理能量。', src: '阿德勒：健康的自豪' },
            { text: '你证明了，害怕也可以行动。这比不害怕要强大得多。', exp: '勇气不是没有恐惧，而是带着恐惧前行。这是阿德勒勇气观的核心。', src: '阿德勒：恐惧与勇气并存' }
        ],
        tired: [
            { text: '用勇气太久会累，今天不用勇敢了，休息也是一种边界。', exp: '《幸福的勇气》指出，持续运用勇气是一种消耗。真正的自主包括“选择不勇敢的权利”——这不是退缩，是主动划定“此刻我选择照顾自己”的边界。课题分离不仅包括分离他人的课题，也包括分离自己对自己的苛求。', src: '课题分离：自我照顾' },
            { text: '休息一下，你不是勇气的逃兵，你是在给勇气的油箱加油。', exp: '意志力是有限资源。休息是恢复自控和勇气储备的必要生理和心理过程。', src: '《幸福的勇气》：资源恢复' },
            { text: '允许自己今天当个“懦夫”，躲进被窝，或看一部不用动脑的剧。这不丢人。', exp: '彻底地接纳自己的状态，不强撑，是对自己诚实的表现。敢于“不勇敢”，本身就是一种勇气。', src: '课题分离：接纳弱点' },
            { text: '如果你觉得一直撑着很累，试着对自己说：“我累了，我可以休息。” 这句话本身就是温柔的勇气。', exp: '自我关怀是勇气的重要面向。表达自己的脆弱，需要不小的内心力量。', src: '《被讨厌的勇气》：自我关怀' },
            { text: '坚持需要勇气，但放弃有时需要更大的勇气。别把“放弃”污名化。', exp: '课题分离：放弃一个不再适合自己的目标，是对自己负责的勇敢行为，而不是失败。', src: '阿德勒：放弃的勇气' },
            { text: '你的精力是有限的，勇敢地把有限的精力用在刀刃上，哪怕今天那刀刃就是“好好吃顿饭”。', exp: '策略性地分配勇气资源，是成熟的表现。不在无关紧要的事上消耗勇气额度。', src: '阿德勒：策略性使用' },
            { text: '有时，闭上眼，深呼吸，然后承认“我今天真的不想努力了”，就是对自己最大的善意。', exp: '抗拒“应该”的暴政。承认此刻的真实状态，是停止内耗的第一步。', src: '《被讨厌的勇气》：停止内耗' },
            { text: '今天，你的课题是“恢复”，而不是“战斗”。把战斗留给明天的你。', exp: '课题分离：分清当前最重要的课题。当能量见底时，恢复就是最高优先级的课题。', src: '课题分离：优先课题' },
            { text: '不用为休息而羞愧，机器都需要停机保养，何况是正在学习勇敢的心。', exp: '将自身比喻为需要保养的精密仪器，而非永动机，能有效化解对休息的罪恶感。', src: '阿德勒：自我接纳' },
            { text: '你不需要时刻准备好为一切负责。你不是世界的救世主，你是你自己的守护者。', exp: '减少过度责任感，是课题分离的核心应用之一。你只对自己的反应和选择负责。', src: '课题分离：责任边界' }
        ],
        anxiety: [
            { text: '你是不是在想“别人会怎么看我”？停一下，把“别人”换成“我自己”。', exp: '《被讨厌的勇气》直接把这个问题定义为“他人中心主义”——你把自己置于他人视线的审判席上。课题分离的关键一步就是把这个审判半径缩小到你自己:我认为这件事怎么样？只有你有投票权。', src: '课题分离：他人评价' },
            { text: '你无法控制事情走向，但你能控制自己怎么对待这份不确定。', exp: '阿德勒心理学把可以控制和不可以控制的事情分开，是最强大的减压工具。焦虑来自试图控制不可控之事。把注意力从“结果如何”转移到“我此刻如何回应”，你就重新拿回了唯一属于你的那把钥匙。', src: '课题分离：可控vs不可控' },
            { text: '你不需要现在就拥有一切答案，可以在恐惧中往前走，这本身就是勇气。', exp: '阿德勒认为，勇气不是没有恐惧，而是带着恐惧行动。如果你在焦虑中仍选择做对的事，就已经在实践幸福的第一步。', src: '阿德勒：恐惧中的行动' },
            { text: '失败是你对自己勇敢过的证明，不是对你价值的否定。', exp: '在阿德勒心理学中，失败只是策略的失效，不代表人格的失败。把失败外部化——这是方法的失败，可以更换方法——能保护你的自我价值。', src: '阿德勒：失败归因' },
            { text: '焦虑是自由的眩晕。它提醒你，你有选择权，而选择带来了不确定性。', exp: '存在主义心理学视角：焦虑源于自由和责任。将焦虑重新框架为“自由的信号”，可以改变与它的关系。', src: '存在主义：自由与焦虑' },
            { text: '如果你害怕被人讨厌，请记住：被别人讨厌是你行使自由、活得自由的证据。', exp: '《被讨厌的勇气》核心观点：自由就是被别人讨厌。追求不被人讨厌会失去自由。', src: '课题分离：被讨厌的自由' },
            { text: '你不需要为你的存在而道歉。你在这里，就值得呼吸，值得拥有空间。', exp: '阿德勒认为，存在本身就有价值，无需通过特别的行为或成就来证明。这是克服他人评价焦虑的根基。', src: '阿德勒：存在价值' },
            { text: '把你担心的事写下来，然后问自己：“这件事我能做什么？不能做什么？” 把不能做的划掉，只关注能做的。', exp: '这是经典的控制二分法实践。通过书写将模糊焦虑具体化，再分离可控与不可控，能迅速降低焦虑水平。', src: '课题分离：二分法练习' },
            { text: '如果最坏的结果真的发生了，你做好准备了吗？往往你会发现，你其实能承受。', exp: '进行负面设想并找到应对方式，能降低对未知的恐惧。这是认知行为疗法中的“去灾难化”技术。', src: '斯多葛哲学：负面想象' },
            { text: '你不需要提前解决所有问题。你只需要解决“下一步”。勇气是一次只呼吸一口空气。', exp: '将注意力缩小到最小的可行动单位，能避免被未来的大山压垮。关注下一步，是焦虑期最有效的行动指南。', src: '阿德勒：聚焦下一步' }
        ],
        sadness: [
            { text: '你现在可以不说理由，可以哭，这是你此时唯一需要为自己做的事。', exp: '《被讨厌的勇气》中提出，情感是个人不可让渡的领地。你的悲伤不需要任何外部解释和合理化，它是一种个人体验，拥有绝对的自主权。允许自己完全拥有它，就是勇气的另一面。', src: '课题分离：情感自主权' },
            { text: '为失去的东西哀悼，为没得到的东西流泪，这是人类最正常不过的反应。不要因此审判自己。', exp: '自我接纳，特别是在情绪低潮时，是阿德勒鼓励的核心内容。把自己当朋友一样安慰。', src: '阿德勒：自我接纳' },
            { text: '你的悲伤不是你软弱，是你对某些东西投入了真心。这份真心很珍贵。', exp: '重新定义悲伤：它是爱的副产品。没有投入就没有悲伤，因此悲伤证明了你在乎。', src: '阿德勒：悲伤的价值' },
            { text: '你可以悲伤，但不必停留在那里。允许潮水来，也允许它慢慢退去。', exp: '接纳情绪的流动，不强求立刻改变。这是改变的前提，而非终点。', src: '《幸福的勇气》：情绪的流动性' },
            { text: '不需要立刻“转念”，此刻，只是感受，就已经在勇敢面对了。', exp: '不逃避负面情绪，就是一种面对和负责。勇敢不是立刻开心，而是愿意待在不适里去理解它。', src: '课题分离：直接体验' },
            { text: '如果你觉得自己不被理解，请做那个第一个理解自己的人。', exp: '外部认可不是必需的。从自我理解和自我共情开始，重建内在的安全感。', src: '阿德勒：自我共情' },
            { text: '你不需要在所有人面前都表现得很坚强。在某些人面前，你可以是脆弱的，这是你的权利。', exp: '有选择地展现脆弱，是基于信任的勇气。课题分离：你决定向谁敞开，是你的课题。', src: '课题分离：选择性脆弱' },
            { text: '过去的事如果让你悲伤，那就承认它对你造成了影响。然后轻轻问自己：我现在能做点什么让自己好过一点点？', exp: '承认影响是疗愈的第一步，然后导向微小行动，重新获得控制感。', src: '阿德勒：导向行动' },
            { text: '有些悲伤是长在骨子里的，不必把它连根拔起，学着和它共处，也是生活的一部分。', exp: '有些创伤是结构性的。学会与无法消除的悲伤共存，发展出生命的深度和韧性。', src: '荣格：整合阴影' },
            { text: '当负罪感或自我贬低涌来时，试着说：“够了，我不需要用内疚惩罚自己。”', exp: '建立健康的自我对话，中断自我攻击的模式，是勇气在自我关系中的实践。', src: '《被讨厌的勇气》：中断自我攻击' }
        ],
        lost: [
            { text: '现在不知道往哪走很正常，但你至少知道不要什么，这也是方向。', exp: '阿德勒心理学强调，人始终拥有“创造性自我”的选择权——当积极目标暂时看不清，从否定的清单开始也是一种主动:你不需要知道一切，你只需要知道下一步不做什么。', src: '阿德勒：创造性自我' },
            { text: '别急，你现在正在重新评估什么东西值得你投入时间——这本身就是最值得做的事。', exp: '我们在迷茫时会误以为自己在虚度，但阿德勒把这种阶段看作“生活风格的重新定向”——你正在后台对“什么是重要的”进行系统重装。这不是停滞，是重要的内部工作。', src: '阿德勒：生活风格重定向' },
            { text: '目标可以慢慢试，你可能需要错很多次，才能刚好对那一次。', exp: '阿德勒认为改变需要实验，而不是一蹴而就。允许自己“试错”，是把生活当成实验室，而不是考场。', src: '阿德勒：实验精神' },
            { text: '迷茫时不急着抓取任何现成的答案，给自己一段空窗期，等待真正属于自己的答案浮现。', exp: '课题分离：拒绝外部强加的价值，空出空间来连接内在的方向。', src: '阿德勒：创造空间' },
            { text: '你可以没有长远目标，但你一定有你今天想呆的地方、想见的人、想吃的东西。这些微小的指向，就是你的星图。', exp: '依靠当下的偏好作为指南针，从微小处着手，逐渐拼接出更大的方向感。', src: '阿德勒：当下导向' },
            { text: '不要因为现在不知道人生的意义是什么就焦虑。你正在活着，这就是正在创造意义的过程。', exp: '存在主义认为，意义不是找到的，是活出来的。迷茫是意义产生的前夜。', src: '存在主义：意义创造' },
            { text: '别人给的地图都是他们走过的路，你自己的路可能还没被画出来。所以，你迷路很正常。', exp: '个体化旅程是独特的。不需要套用他人的模版。你的迷茫是因为你是开拓者。', src: '荣格：个体化旅程' },
            { text: '试着把“我应该做什么”换成“我想试试做什么”。一个字的变化，世界就松动了。', exp: '摆脱“应该”的暴政，转向内在动机的探索。这是从义务感转向自主感的关键。', src: '阿德勒：消除“应该”' },
            { text: '你不需要马上找到终身的热爱，能找到现阶段让你好奇的东西，就已经足够好了。', exp: '降低期望至可管理的程度。阶段性的兴趣是长线目标的原材料，不需要一步到位。', src: '阿德勒：渐进探索' },
            { text: '有些时候，我们需要停一停，只是呼吸、存在，让答案自己走来，而不是去追它。', exp: '被动性的智慧。在非用力追求中，常常会得到顿悟。这是内倾直觉的工作方式。', src: '荣格八维：内在等待' }
        ],
        relationship: [
            { text: '那个人怎么想是他的事，你管不了。能管好自己怎么应对，已经是满分。', exp: '这是课题分离在亲密关系中最核心的应用——对方的情绪、对方的反应、对方的选择，统统是对方的课题。你唯一的课题是:我该如何诚实而尊重地表达和行动？守住这条线，关系的纠结会减少九成。', src: '课题分离：关系应用' },
            { text: '你可以说出“不”，而不用给出一本理由说明书。', exp: '拒绝是勇气的重要表现。《被讨厌的勇气》建议：拒绝时，简单而坚定，不需要过度解释，因为解释很容易被对方视为可谈判的起点。', src: '课题分离：说不的权利' },
            { text: '如果你总是为了维持关系而压抑自己，你其实不是在维护关系，你是在慢慢离开自己。', exp: '自我背叛是关系中的巨大损耗。真正的亲密需要两个完整的个体，不会要求一方消失。', src: '阿德勒：自我完整性' },
            { text: '敢于表达不同的意见，是相信关系能承受这种差异。这是一种更深层的信任。', exp: '冲突检验关系的强度。允许差异被表达，是健康关系的标志。压抑差异才会让关系腐烂。', src: '课题分离：差异性表达' },
            { text: '你不需要为别人的情绪负责，除非那是你直接造成的伤害。区分责任界限。', exp: '过度的情绪责任是边界模糊的表现。你可以在意他人，但无需为他人的情绪承担罪责。', src: '课题分离：情绪责任' },
            { text: '如果一段关系让你总是怀疑自己，请鼓起勇气重新审视它。你值得被滋养，而不是被消耗。', exp: '阿德勒认为，共同体感觉是健康的，而消耗性的关系是病态的。离开或改变这种关系需要勇气。', src: '阿德勒：健康的共同体' },
            { text: '去爱，即使可能受伤。封闭自己虽然安全，但那是另一种死亡。', exp: '《幸福的勇气》指出，爱需要勇气，因为它意味着决定去信任，并为之承担可能的痛苦。这是一种主动的选择。', src: '《幸福的勇气》：爱的勇气' },
            { text: '别期待完美的关系，先做那个在关系中愿意主动修复的人。', exp: '阿德勒重视贡献感。主动伸出橄榄枝，不低人一等，反而能引领关系走向修复。', src: '阿德勒：贡献感' },
            { text: '有时最大的勇气不是坚持，而是放手。如果一段关系已完成它的使命，感谢它，然后继续前行。', exp: '阿德勒认为，过去的关系是“美好的昨日”，放手是为了彼此更好的未来。这是对自己和对方的尊重。', src: '阿德勒：分离的勇气' },
            { text: '在关系中，你永远有选择权，选择如何回应、如何设定边界、如何爱。', exp: '即使看似别无选择，我们仍可以选择自己的态度。这是终极的自由，也是关系的责任。', src: '弗兰克尔：终极自由' }
        ],
        strive: [
            { text: '奋斗是你自己为自己的生命选的事，不是谁强加给你的——想想这一点，它就有了不同的重量。', exp: '阿德勒认为，当人把努力视为“自己主动选择的贡献”而非“被迫的任务”时，同一件事的体验完全不同。你重新把奋斗定义成你选择的事，而不是不得不做的事，这本身就是一种解放。', src: '阿德勒：主动选择' },
            { text: '就算结果不如预期，你也没有白干。过程里的你，已经和出发时不一样了。', exp: '《被讨厌的勇气》指出，人生是点的连续，不是一条线——你此刻是在认真地活在当下这个“点”上，而不是为了到达某个远方的终点而抵押现在。所以不管结果如何，这个点的你已经因为努力而变了。', src: '阿德勒：此时此刻' },
            { text: '不用跟别人比速度，你的路只有你在走。', exp: '阿德勒心理学反对纵向竞争，提倡追求自我超越。你的比较对象只有昨天的自己。', src: '阿德勒：自我超越' },
            { text: '即使步伐很小，只要你没有停，就是在向目标靠近。慢，也是一种前进。', exp: '持续的小进步比间歇性冲刺更有效。对自己的节奏给予耐心，是勇气的日常实践。', src: '阿德勒：渐进勇气' },
            { text: '今天的目标可能只是“整理好桌面”，如果做到了，你就已经赢了今天。', exp: '把宏大目标切分成可执行的小步骤，每一步的成功都会积累自我效能感。', src: '阿德勒：小步前进' },
            { text: '别人可能只看到你的结果，但过程里的挣扎、犹豫和不放弃，才是你真正的勋章。', exp: '奋斗的价值在于过程塑造的品格，而非仅仅结果。为自己在过程中的坚持感到自豪。', src: '阿德勒：过程价值' },
            { text: '勇敢地开始，也勇敢地调整，甚至勇敢地放弃。这都是你在掌舵的标志。', exp: '持续评估和调整策略，是自主性的体现。及时止损或掉头，比盲目坚持更需要勇气。', src: '阿德勒：适应性调整' },
            { text: '你现在付出的努力，可能不会立刻回报，但它正在储蓄，储存在你未来的可能性里。', exp: '延迟满足和长期主义需要信心。相信现在的播种，是对未来的自己最大的慷慨。', src: '阿德勒：长期视角' },
            { text: '别忘了为自己在没有白干的日子里，找点甜头。这能帮你走得更远。', exp: '自我奖励是维持长期奋斗的必要手段。将奋斗与快乐联结，避免沦为苦行。', src: '阿德勒：自我激励' },
            { text: '奋斗不是为了证明给谁看，而是为了回应你内心那个想成为更好版本的自己的声音。', exp: '内在动机远强于外部评价。当奋斗是为了自我实现，而非证明，你会体验到更深的满足。', src: '阿德勒：自我实现' }
        ]
    },
    finance: {
        celebration: [
            { text: '为财务上每个小进步开心，这不是小气，这是在给自己正反馈。', exp: '《小狗钱钱》的核心方法论之一就是将长期目标拆解为可庆祝的中小步骤，并真的去庆祝它。因为在理财行为学上，只有被正面反馈强化的行为才会持续。开心的后面，是更多的行动。', src: '《小狗钱钱》:正反馈闭环' },
            { text: '今天又存下了一小笔，那是未来的你，对今天你的感谢。', exp: '储蓄是对未来自己的关爱。将储蓄可视化为一种自我关怀，能增强储蓄行为的情感动力。', src: '《小狗钱钱》：自我关怀式储蓄' },
            { text: '哪怕只是少花了一笔不必要的钱，也是在为自己的城堡添砖加瓦。', exp: '控制支出不总是一种剥夺，而是一种主动建设。重新定义节约，让它与成就感和安全感挂钩。', src: '综合理财：建设性节约' },
            { text: '看着账户余额一点点增长，那种踏实感是任何消费都无法替代的。', exp: '李笑来强调，财务安全带来的心理平静远胜于短暂的消费快感。庆祝这种宁静是明智的。', src: '李笑来：安全感的喜悦' },
            { text: '投资有了收益，那是不用你的劳动就赚到的钱，这是“金钱在为你工作”的证据。', exp: '《富爸爸》提出被动收入的概念。庆祝被动收入，是强化资产思维的有效方式。', src: '《富爸爸》：庆祝被动收入' },
            { text: '你成功抵制了一次冲动消费，这等于你为自己的梦想基金多存了一笔。为你的自律欢呼！', exp: '将自律行为与具体梦想连接，赋予其情感价值，比单纯的控制更有效。', src: '《小狗钱钱》：梦想相册' },
            { text: '恭喜你还清了一笔债务！这释放的不仅是财务压力，更是心理空间。', exp: '债务偿还不仅是数字变化，更能在心理上带来巨大的解脱和自由感。值得大大庆祝。', src: '综合理财：庆祝债务自由' },
            { text: '理财路上的每一个里程碑，无论多小，都是你对自己生活的掌控力在增长。', exp: '掌控感是心理健康的关键。财务里程碑是这种掌控感的具体、可量化的体现。', src: '综合理财：掌控感' },
            { text: '把你的成功经验分享给同样在理债或存钱的朋友，庆祝的氛围会翻倍。', exp: '《小狗钱钱》中提倡找到志同道合的伙伴。分享成功能强化正向行为，并获得社会支持。', src: '《小狗钱钱》：社群力量' },
            { text: '今天你的“鹅”又肥了一点，离靠“蛋”生活又近了一步。', exp: '用《小狗钱钱》中的“鹅与金蛋”的比喻，将抽象财务目标具象化、趣味化，易于坚持。', src: '《小狗钱钱》：鹅与金蛋' }
        ],
        tired: [
            { text: '处理钱很累的时候，让已经配置好的东西自己运转，你离场歇一会儿。', exp: '《富爸爸》提出的关键概念是“让钱为你工作”——这意味着健康资产本身具有被动收入属性。你不需要永远盯盘和管理，休息时系统也在运作。这既是理财的自由，也是你该用的权利。', src: '《富爸爸》:被动收入' },
            { text: '理财是一场马拉松，不是百米冲刺。累了就慢下来，慢就是稳，稳就是快。', exp: '长期投资尤其需要耐力，保持节奏比爆发力更重要。避免在疲惫时做出冲动的财务决策。', src: '综合理财：长期主义' },
            { text: '不用时刻盯着数字，投资的价值在于时间，不在于你盯盘的小时数。', exp: '避免过度交易。多数成功的投资靠的是时间复利，而非频繁操作。把时间还给生活。', src: '李笑来：时间价值' },
            { text: '记账卡住了？做预算很烦？今天先放下，去户外走走。好心情才能做出好决策。', exp: '财务烦躁时，强迫自己继续可能导致放弃。休息和恢复好状态，是保持财务纪律的前提。', src: '综合理财：情绪与决策' },
            { text: '让自动化程序为你工作：自动转账、自动定投。累的时候，靠机制，别靠意志力。', exp: '行为经济学家建议“预先承诺”。通过自动化减少决策次数，能极大节省心理能量，尤其在疲惫时。', src: '《小狗钱钱》：自动化理财' },
            { text: '如果你的脑袋被钱字压得喘不过气，读一本简单的理财书，比如《小狗钱钱》。它会像朋友一样拍拍你。', exp: '用故事性、正向的理财内容替换焦虑性信息，能有效改善理财疲劳和恐惧。', src: '《小狗钱钱》：轻松学习' },
            { text: '财务疲劳的时候，做一次财务快照而非详细审计。知道大致的安全边界就行。', exp: '降低完美主义标准。在能量低时只需确认底线，而非追求百分百精确，减少内耗。', src: '综合理财：模糊正确' },
            { text: '今天不想做任何跟钱有关的事？那就别做。明天太阳照常升起，你的账户也不会跑。', exp: '允许“财务假期”。偶尔的完全脱离，可以防止倦怠，恢复对理财的新鲜感。', src: '综合理财：财务假期' },
            { text: '把复杂的财务任务拆分成很多小步骤，累的时候只完成最小的一步，比如“打开账本”。', exp: '微小行动法。仅启动行为，不要求完成，常常会让你在疲倦中仍能取得进展。', src: '《小狗钱钱》：分解任务' },
            { text: '感到累，可能因为你在用单一收入模式硬撑。这恰好是审视收入结构的契机。', exp: '疲惫有时是系统性的警告。思考是否需要开辟第二收入来源或优化资产配置，以获得更多被动收入，减少主动劳力。', src: '《富爸爸》：收入结构反思' }
        ],
        anxiety: [
            { text: '钱上头的事让你慌，就先回到基础:你的收支结构稳不稳？稳了就有底气。', exp: '综合理财原则中，焦虑的首要对治不是寻找更高的收益，而是回到最基本的“预算-支出-应急金”框架。当你知道无论发生什么，接下来六个月的生活无忧，大部分财务焦虑就已经被釜底抽薪。', src: '综合理财:财务基础感' },
            { text: '先别看收益率，先看你是否能睡得着。你睡得着，就是对的。', exp: '李笑来在《财富的真相》中反复强调“不失眠的投资才是好投资”——一个人的风险承受能力不是问卷测出来的，是睡眠测出来的。焦虑是内倾直觉(Ni)在提示你这个东西超出了你的真正容忍度，你要听。', src: '李笑来:睡眠测试' },
            { text: '市场下跌，你的心也悬着？这正是检验你投资品的时刻：不懂的不投，睡不着的不投。', exp: '用熊市来检验持仓是否适合自己。超出风险承受能力的投资，即使赚了钱，过程也是痛苦的，不符合理财的初衷。', src: '综合理财：风险匹配' },
            { text: '害怕钱变少？先把那些拿去买高风险产品的钱，想象成已经丢了。只用丢得起的钱去冒险。', exp: '心理账户隔离：将投资资金视为“已经花掉的钱”，能降低对波动的焦虑，更理性地决策。', src: '综合理财：心理账户' },
            { text: '你最可靠的资产是你自己，你的能力、你的认知。投资自己永远不会亏。', exp: '李笑来强调，人的生产能力是财富的根本。在财务焦虑时，转而投资自己的知识和技能，是回报最高的投资。', src: '李笑来：投资自己' },
            { text: '现金不是垃圾，它是你生活中的氧气。在极端时刻，它能救命。', exp: '充分认识现金及现金等价物（应急金）的重要性。它不是低效，而是给你选择权和安全感。', src: '综合理财：现金的价值' },
            { text: '还债压力大？和债主诚恳沟通，制定可行计划。主动面对比逃避更能化解焦虑。', exp: '《小狗钱钱》建议公开直面债务。诚实和计划性不仅能得到可能的通融，更能重塑内心的掌控感。', src: '《小狗钱钱》：诚实面对债务' },
            { text: '别因为看别人赚钱而焦虑，那是幸存者偏差。你只能赚到你认知范围内的钱。', exp: '能力圈原则。专注扩展自己的认知，而不是追逐他人的热点，是长期获利和保持心态的唯一正道。', src: '综合理财：能力圈' },
            { text: '理财焦虑是正常的，说明你对未来有责任感。把这份责任感，转化成学习一个理财小知识的动力。', exp: '重定义焦虑为行动的起点，导向学习和优化，而非精神内耗。', src: '综合理财：焦虑转化' },
            { text: '想象一下最坏的财务情况，为之建立计划。一旦你知道最坏也能应付，焦虑就消散大半。', exp: '这是底线思维。通过构建安全网，为冒险设好下限，从而获得心灵的自由。', src: '李笑来：底线思维' }
        ],
        sadness: [
            { text: '亏了钱是可以心疼的，这不叫韭菜心态，这是你的劳动和时间。', exp: '《财富的真相》指出，钱背后是人的真实生产时间。一笔损失不只是数字的减少，是你用生命的一段换来的东西消失了。为它难过是合理的——只有承认了这份沉重，你才能真的放下和复盘。', src: '李笑来:钱的时间属性' },
            { text: '金钱损失带来的痛感，是进化赋予我们的保护机制。难过，说明你在乎，这是正常的。', exp: '损失厌恶是人的天性。接纳这种情绪，不因“难过”而二次批判自己，是自愈的第一步。', src: '行为经济学：损失厌恶' },
            { text: '如果因为钱的事感到内疚，请区分：你是在为过去的决定后悔，还是在为现在的无知羞愧？两者都可以改变。', exp: '将内疚具体化，指向可改变的行为：后悔可以复盘，无知可以学习。避免沉溺于模糊的自我攻击。', src: '李笑来：转化内疚' },
            { text: '别用一时的财务挫折来定义你的价值。你的净值不等同于你的自我价值。', exp: '净值是财务指标，自我价值是存在性指标。将二者分离，是保护心理健康的关键。', src: '综合理财：分离净值与价值' },
            { text: '为那些花错了的钱心疼，正是这些教训才让你真正学会管理。把它看作缴纳的学费。', exp: '重新认识损失：它是学习成本。每笔教学费都让你离财务智慧更近一步。', src: '《富爸爸》：学费观' },
            { text: '如果你曾因家庭财务而受伤，那是过去的伤痕。现在你已经有能力为自己建立不同的财富观。', exp: '原生家庭的金钱观念可以重新审视和选择。你不需要继承所有的财务脚本。', src: '《财富的真相》：重写金钱剧本' },
            { text: '悲伤时刻，可以写一封信给你失去的钱，表达你的惋惜和感谢，然后告别。', exp: '仪式化可以帮助处理财务相关的情绪。写信是一种心理上的完结，可以放下包袱继续前行。', src: '综合理财：财务情绪仪式' },
            { text: '你可能觉得钱很俗气，但合理的悲伤，正是你在意自己和家人生活品质的体现。', exp: '直面金钱的意义：钱是工具，热爱生活才是目的。悲伤说明你珍视钱所代表的生活品质。', src: '李笑来：钱为生活服务' },
            { text: '如果因为一次投资失败就再也不敢踏入市场，那这次失败就是真正的失败。它剥夺了你未来的可能。', exp: '区分一次策略失效和整个系统的否定。从失败中学习，是通往成功的唯一道路。', src: '综合理财：失败后学习' }
        ],
        lost: [
            { text: '对钱完全没方向的时候，先问自己一个简单的问题:我最想让钱为我的生活解决什么？', exp: '《小狗钱钱》把财务迷茫的破解点从“怎么赚”转移到“为什么要赚”——当你的财务目标变得具体(不是“更有钱”而是“我可以辞掉那份消耗我的兼职”)，迷茫就会被具体的行动替代。', src: '《小狗钱钱》:具体化目标' },
            { text: '眼前没思路，不妨先记录每天的花销。看见钱都去哪儿了，是财务清醒的第一步。', exp: '李笑来指出，财务最根本的基础是真实感的建立——你觉得自己大概知道花了多少，但通常和实际情况差距巨大。记一周的账，能让你从模糊的不安中进入清晰的数据世界，这是从迷茫到掌控的起点。', src: '李笑来:财务真实感' },
            { text: '如果你不知道从哪开始理财，先从存下收入的十分之一开始，这动作永远不会错。', exp: '《巴比伦最富有的人》及《小狗钱钱》中养*鹅*的原则——先支付自己。无论收入多少，坚持存下一部分，这是最基础的财务纪律。', src: '《小狗钱钱》:养鹅' },
            { text: '不知道投什么？可以先从最基础、最广泛的指数基金开始学习。它代表整个市场的平均增长。', exp: '对于初学者，指数基金是低成本、分散化的入门工具。它不求战胜市场，只求获得市场平均回报。', src: '综合理财：入门指数基金' },
            { text: '制定你的第一份预算表，它不是限制你，而是告诉你，你可以在哪些地方尽情花钱。', exp: '预算的本质是分配，是主动掌控，而非剥夺。它能帮助你明确花钱的优先级，从而获得自由。', src: '《小狗钱钱》：预算即自由' },
            { text: '理清你的资产和负债，这是财务的地基。然后慢慢造房子。', exp: '《富爸爸》的核心概念：明确什么是资产（把钱放入你口袋的），什么是负债（把钱从你口袋拿走的），并据此调整。', src: '《富爸爸》：资产负债认知' },
            { text: '给你自己建一个梦想储蓄罐或梦想相册，把你的财务目标可视化，迷茫时多看几眼。', exp: '将目标视觉化、情感化，能持续激发理财动力，抵抗日常的迷茫和诱惑。', src: '《小狗钱钱》：梦想可视化' },
            { text: '迷茫时，先把财务目标从“致富”换成“财务安全”，再换成“财务独立”，逐步升级。', exp: '建立递进式的目标：先安全（应急金），再独立（被动收入覆盖基本开支），最后才是自由。这能让路径更清晰。', src: '综合理财：阶梯目标' },
            { text: '你不必完全理解所有复杂的金融产品。接受“我不懂，所以我不投”的坦然。', exp: '能力圈思维。承认自己不懂，并坚守边界，能避免大量迷茫和损失。这是智慧的起点。', src: '李笑来：不懂不投' },
            { text: '坐下来，用一个下午的时间，算算你余生大致需要多少钱，以及你的赚钱时间。这个宏观图景很有用。', exp: '一个粗略的生命财务模型，能让你看清现状，找到努力的方向和节奏，减少不确定性的焦虑。', src: '李笑来：宏观财务规划' }
        ],
        relationship: [
            { text: '钱不只影响你们怎么花钱，也影响你们怎么表达信任和对未来的规划。', exp: '综合理财领域的大量研究重复一个发现:伴侣间金钱冲突的核心很少是金额，而是信任(你花钱之前不跟我说)、权力(凭什么你来管)、未来感(我们到底往哪走)。所以你们需要聊的不是钱，是钱背后的这三个东西。', src: '综合理财:金钱关系本质' },
            { text: '能坐下来一起谈钱，已经比很多关系强太多了。', exp: '《财富的真相》提到，大量伴侣回避金钱对话，把它等同于破坏和谐。但愿意一起面对这个最“不浪漫”的话题，恰恰是成年人的深度信赖——你们在做的不是麻烦，是信任基建。', src: '李笑来:金钱沟通的价值' },
            { text: '和伴侣设定共同的“梦想基金”，一起为之努力，能极大增强财务协同和情感连接。', exp: '共同目标能凝聚彼此。设立一个双方都向往的基金（旅游、换房等），让存钱变成一起奔赴美好的事。', src: '《小狗钱钱》：共同梦想' },
            { text: '允许彼此有一定的“自由支配资金”，不需要事事汇报，这是财务上的尊重和边界。', exp: '在共同账户外设立个人“疯狂基金”，可以避免大部分因消费差异引起的争执，维护个体独立性。', src: '综合理财：财务边界' },
            { text: '财务上的不平等感是许多矛盾的根源。开诚布公地讨论收入、支出和期望，才能找到公平方案。', exp: '金钱权力动力学。透明度是解决此问题的第一步，共同制定公平的贡献比例或方式。', src: '综合理财：金钱权力动力学' },
            { text: '在钱的问题上，试着先听伴侣说完，理解ta的金钱剧本来自何处（家庭、经历）。这比争对错重要得多。', exp: '每个人的金钱观念都有来源。理解对方的历史，能产生共情，为找到折衷方案打下基础。', src: '《财富的真相》：理解金钱剧本' },
            { text: '定期举行“家庭财务会议”，可以每月一次，聊聊近况、调整计划，这本身就是一种承诺。', exp: '将财务沟通制度化，创造安全的讨论空间。它能规避日常突发争吵，让谈钱变得寻常和健康。', src: '综合理财：财务会议' },
            { text: '如果一方是全职持家，肯定其劳动的价值，并在财务分配上给予充分尊重和共享。', exp: '非货币劳动的价值认可。金钱不能成为权力压迫的工具，应视为家庭共同成果并共享。', src: '综合理财：认可非货币贡献' },
            { text: '在重大财务决定前，设定“冷静期”，比如大额消费前等待24小时，并互相告知。', exp: '《小狗钱钱》中提到的延迟消费策略，用于伴侣间能增加透明度，并防止冲动消费损害信任。', src: '《小狗钱钱》：冷静期' },
            { text: '金钱问题往往是关系问题的温度计，但别只靠它开药方。解决深层的信任和尊重问题，钱的事才好理顺。', exp: '金钱冲突常是深层问题的表征。改善关系模式，财务矛盾往往也会缓和。', src: '综合理财：根本问题' }
        ],
        strive: [
            { text: '你正在让钱更有效率地工作，而不是你自己疲于奔命——如果是这样，那方向没错。', exp: '《富爸爸》的核心理念就是用资产产生的现金流替代个人劳动——你正在从“人赚钱”的模式切换到“钱赚钱”的模式。确认一下:你做的努力是在建系统，还是在消耗自己？前者值得加倍投入。', src: '《富爸爸》:系统vs消耗' },
            { text: '注意你花出去的每一块钱，它是你生命的一份子。把它用在真正重要的事上。', exp: '李笑来强调，钱是时间的凝结物，花钱就是在花生命。审慎消费不是吝啬，是对自己生命的尊重。', src: '李笑来:钱与生命' },
            { text: '努力提升你的专业技能，这是你最强大的赚钱能力来源，也是最好的投资。', exp: '人力资本是第一资本。在能力上的投资，往往回报率最高且风险最低。', src: '李笑来：提升生产力' },
            { text: '在你还没有足够本金时，拼命存钱、降低物欲，就是最快的致富手段。', exp: '储蓄率是早期财富积累的关键。通过控制支出快速积累本金，比追求高收益更实际。', src: '《小狗钱钱》：储蓄率' },
            { text: '要分清“资产”和“负债”，不断买入资产，减少负债。这是富爸爸的根本法则。', exp: '《富爸爸》的核心原则。以此作为行动指南，长期坚持会彻底改变财务状况。', src: '《富爸爸》：资产积累' },
            { text: '建立多元收入来源，不要把鸡蛋放在一个篮子里，尤其是那个叫“工资”的篮子里。', exp: '抗风险思维。逐渐增加副业或被动收入流，能增强整体财务的安全性。', src: '综合理财：多元收入' },
            { text: '学习投资，但从最小的金额开始实践。实践中的学习和体会，是书本给不了的。', exp: '《小狗钱钱》鼓励立即行动，用小额资金获取真实市场经验，这远胜于单纯理论学习。', src: '《小狗钱钱》：小额实践' },
            { text: '为你的各种财务目标设置专门的子账户（旅行、紧急备援金等），看着它们各自成长。', exp: '分账户管理法能将模糊的大目标可视化、具体化，每笔进账都变成一次小胜利。', src: '《小狗钱钱》：分账户管理' },
            { text: '每天学一点理财知识，一年后你就是半个专家。知识和认知的复利，同样是巨大的财富。', exp: '认知复利。持续学习财务知识，会随着时间积累成巨大的决策优势和财富机会。', src: '李笑来：认知复利' },
            { text: '别忘了，奋斗的终局不是钱本身，而是钱带来的自由、时间和选择权。', exp: '钱是实现人生目标的工具。明确钱的终极作用，让理财奋斗有了持续的内在驱动力。', src: '李笑来：工具与自由' }
        ]
    },
    communicate: {
        celebration: [
            { text: '刚才的沟通让彼此都舒服，因为你们都让对方感受到了重视。', exp: '《爱的五种语言》中最容易被忽视的就是“精心的时刻”和“肯定的言辞”——你刚才同时使用了两者:专注地听(精心时刻)和真诚地肯定。这种组合能瞬间提升关系连接感。', src: '《爱的五种语言》:双重语言' },
            { text: '一次愉快的交流，就像给关系银行存了一大笔款。记下这个成功经验。', exp: '积极互动是关系账户的存款。识别并庆祝这些时刻，能激励我们更多地去创造它们。', src: '非暴力沟通：关系存款' },
            { text: '你刚才的表达清晰又温柔，既不委屈自己，又照顾了对方。这是完美的平衡。', exp: '非暴力沟通追求的表达：诚实而不伤害。你做到了兼顾双方感受的“中道”。', src: '非暴力沟通：平衡表达' },
            { text: '当你真诚地说“谢谢”时，你不仅肯定了对方，也滋养了自己。', exp: '感激能同时提升给予者和接收者的幸福感。它是一种可习得的沟通习惯。', src: '《爱的五种语言》：肯定的言辞' },
            { text: '今天你完成了一次非暴力沟通的实践，这是心灵的胜利。', exp: '为自己的进步庆祝，强化新沟通模式的神经通路。每一次成功都在让新模式更巩固。', src: '非暴力沟通：庆祝实践' },
            { text: '对话中那些自然的沉默，并不尴尬，说明你们已足够信任，无需用言语填满所有空隙。', exp: '高品质关系允许沉默存在。能够共享安静而不焦虑，是连接深厚的重要指标。', src: '《爱的五种语言》：精心的时刻' },
            { text: '你用了“我”开头来表达感受，而不是“你”，这太棒了。这是沟通的革命。', exp: '使用“我陈述句”（我感到…）而非“你陈述句”，能极大降低听话者的防御，促进真正对话。', src: '非暴力沟通：我陈述句' },
            { text: '看到对方因为你说的而感到被理解，那个笑容，就是你最好的沟通勋章。', exp: '共情的成功标志是对方接收到并被抚慰。留意这些积极反馈，它们会告诉你正走在正确的路上。', src: '非暴力沟通：共情验证' },
            { text: '即使在观点不同时，你们也愿意倾听并承认对方的合理性。这本身就是值得庆祝的关系奇迹。', exp: '做到“不同意但仍能共情”是极其成熟的沟通境界，它保护了关系，并允许创造性方案出现。', src: '非暴力沟通：接纳差异' },
            { text: '别忘了庆祝你在独处时对自己的温柔表达。自我对话也是沟通。', exp: '非暴力沟通也应用于自身。当你对自己不再苛责，而是用理解的语言，那是沟通革命的起点。', src: '非暴力沟通：自我沟通' }
        ],
        tired: [
            { text: '累的时候能说出“现在没法好好说话”，比你硬撑着应付要温柔得多。', exp: '非暴力沟通(NVC)的第一步就是诚实地表达自己的状态——你说出“我现在没有精力”，比强打精神却暗暗怨恨要好太多。这不是拒绝沟通，是给高品质沟通创造前提。', src: '非暴力沟通:诚实表达状态' },
            { text: '今天不想聊？那就不聊。用微笑、点头，或只是待在同一个房间，也算沟通。', exp: '沟通不仅是言语。疲惫时的非言语连接同样有价值，甚至更不费力。', src: '《爱的五种语言》：精心的时刻' },
            { text: '如果你现在一点共情能力都挤不出来了，告诉对方：“我很想听，但我现在太累了。等我休息一小时再说好吗？”', exp: '诚实设定期限并承诺再次回来，能给双方安全感。对方不会觉得被永久拒绝，你也能得到必要恢复。', src: '非暴力沟通：设立沟通边界' },
            { text: '沟通前先照顾好自己的身体：一口水，一个深呼吸，一个伸展。你的身体舒服了，说出的话会更平和。', exp: '身心相连。简单的身体照顾能直接降低应激水平，避免疲惫时伤人伤己的沟通。', src: '非暴力沟通：身体预备' },
            { text: '累了就别聊复杂的事。可以两个人一起做无聊的事，比如看无聊电视，这本身就是一种默契沟通。', exp: '并列存在（Parallel play）是一种低耗能连接方式。共享空间而不需要密集交谈，能让彼此在疲倦中仍感到陪伴。', src: '心理学：并列存在' },
            { text: '当伴侣疲惫时，简洁的问候或一个拥抱，往往胜过长篇大论。', exp: '在对方能量低时，使用“服务的行动”或“身体的接触”这类更省力的爱语，效果更好。', src: '《爱的五种语言》：因时制宜' },
            { text: '疲惫时沟通，用最少的词，说最核心的感受。例如：“我很累，我想静一静。”', exp: '语言精简能减少认知负荷。非暴力沟通的“紧急模式”：仅表达观察和感受。', src: '非暴力沟通：紧急沟通' },
            { text: '如果你必须此时沟通，请降低期待：不求解决问题，只求交换信息。', exp: '区分“讨论”和“决策”。疲惫时不适合做决策，但可以分享信息，为之后的决策铺垫。', src: '非暴力沟通：明确沟通目的' },
            { text: '给对方发一个“电量不足”的表情包，这有时比组织语言更快速有效。', exp: '利用共同符号系统进行高效情感沟通。这是当代亲密关系中的一种实用创新。', src: '非暴力沟通：符号化表达' },
            { text: '感到累时，对自己说：“我可以暂停，我可以沉默，我有权不说话。” 这是对自己的非暴力。', exp: '自我同情是有效沟通的前提。允许自己停止输出，才能避免因透支而爆发负面沟通。', src: '非暴力沟通：自我共情' }
        ],
        anxiety: [
            { text: '你怕自己说错话，但“我有点紧张，不知道怎么说才好”其实本身就是很好的开场白。', exp: '非暴力沟通鼓励用“当下的真实感受”作为困难的切入点，而不是等到想好了完美的表达才开口。你紧张，就说你紧张;你这本身就是最真诚的沟通启动——它比任何精心组织的句子都更能拉近距离。', src: '非暴力沟通:当下感受' },
            { text: '有些话一开口好像就要吵起来，先跟对方说:我不是要跟你吵，我只是有点着急了。', exp: '非暴力沟通把这种预防性的说明称为“情境设定”——在内容之前，先把你的意图和情绪状态摆出来。对方听到的不是攻击，而是一个人在解释自己为什么这样说话，防御就松动了。', src: '非暴力沟通:情境设定' },
            { text: '避免说“你总是”和“你从不”，试试说“我注意到这次...”，世界会安静很多。', exp: '非暴力沟通中的观察要素要求区分事实和评价。“总是”、“从不”是夸张的评价，会引发防御；而具体地陈述事实，能保持沟通通道。', src: '非暴力沟通：观察与评价' },
            { text: '沟通恐惧时，先在心里对自己说：“我的想法很重要，我的感受也值得被听见。”', exp: '自我赋权。焦虑常源于低自我价值感。对自己进行肯定，是鼓起勇气表达的第一步。', src: '非暴力沟通：自我赋能' },
            { text: '如果担心对方反应大，可以试着先说：“我接下来说的话可能让你不舒服，但我想和你一起想办法。”', exp: '预告式沟通。提前给予对方情绪预告，能缓冲冲击，并显示你的合作意图。', src: '非暴力沟通：预告与协作' },
            { text: '你可以把想说的话先写在纸上，念一遍给自己听。这能帮你梳理思路，降低当面说的焦虑。', exp: '脱敏与结构化。书面准备能减轻即时压力，让你更专注于表达本身。', src: '非暴力沟通：准备与练习' },
            { text: '在感到焦虑的沟通中，试着用请求代替要求。比如：“你可以帮我一个忙吗？”比“你必须…”要好得多。', exp: '要求让人反抗，请求给人选择。后者尊重了对方的课题，更容易促成合作。', src: '课题分离：请求与要求' },
            { text: '当你觉得自己要爆发时，运用S.T.O.P.：停（Stop），呼吸（Take a breath），观察（Observe），再继续（Proceed）。', exp: '这是正念减压技巧，用于紧急情绪调节。能中断自动化反应，让你有选择地回应，而不是被动反应。', src: '正念沟通：STOP技术' },
            { text: '沟通的焦虑常常来源于想“赢”或不想“错”。试着放下对错，把目标换成“理解彼此”。', exp: '从“对错模式”切换到“联结模式”，能极大降低沟通的威胁感。', src: '非暴力沟通：目标重塑' },
            { text: '即使沟通结果不完美，只要你诚实表达了，就已经是巨大的胜利。别用结果惩罚自己的努力。', exp: '将表达本身视为成功，而不取决于对方是否接受或改变。这能保护你继续尝试的勇气。', src: '课题分离：过程即成功' }
        ],
        sadness: [
            { text: '如果你想说话就说，不想说就安静地待着，两个人都舒服。', exp: '《爱的五种语言》中，有些人表达关爱的方式就是“服务的行动”或“安静的陪伴”而非言语。允许彼此用不同的语言处理情绪，这本身就是最温柔的沟通。', src: '《爱的五种语言》:多种表达' },
            { text: '难过时，如果有人对你说：“我不知道说什么，但我在听。” 这就是最好的话语。', exp: '示弱是真诚的最高形式。承认自己无法解决，但愿意陪伴，是深度的共情。', src: '非暴力沟通：谦逊的共情' },
            { text: '当你难过时，试着用具体的词汇描述它：“我感到心口闷闷的，有点像被捏住了。” 身体化的表达有时比情绪词更准确。', exp: '关注身体感觉（感官觉察）是非暴力沟通的基础，能绕过思维防御，直达真实体验。', src: '非暴力沟通：感官觉察' },
            { text: '如果你不知如何安慰，一个温柔的沉默比任何陈词滥调都更有力量。', exp: '安慰不是解决问题，而是传递“你不孤单”。沉默的在场有时是最大的共情。', src: '《爱的五种语言》：精心的时刻' },
            { text: '悲伤时，你可能需要“被倾听”，而不是“被修复”。提前告诉对方：“我只是需要你听我说，不需要建议。”', exp: '明确告知对方自己需要的支持类型（倾听而非建议），能避免二次挫折，让沟通更有效。', src: '非暴力沟通：表达需求' },
            { text: '如果真的说不出话，写张小纸条：“今天有点难过，不想说话，但谢谢你在。” 这纸条就是你们的桥梁。', exp: '间接沟通方式适用于无法直接表达时。它同样能完成连接并设立边界。', src: '非暴力沟通：替代性表达' },
            { text: '不要对自己说“振作起来”。而是说“我可以难过，这很正常”。用温暖的声音对待自己。', exp: '将非暴力沟通应用于自身内部对话。自我同情是处理悲伤的基本能力。', src: '非暴力沟通：自我共情' },
            { text: '当朋友悲伤时，不要急着问“为什么”，而是说“愿意多跟我说说吗？”。开放性问题让人感到安全。', exp: '“为什么”有时听起来像质问。用邀请式的开放提问，让对方掌握倾诉的主导权。', src: '非暴力沟通：开放提问' },
            { text: '眼泪也是一种沟通，它是心的语言。如果它流下来了，就让它完成表达。', exp: '承认非语言沟通的有效性。允许情绪通过生理途径表达，无需压抑，这也是对自己和他人的诚实。', src: '非暴力沟通：尊重非语言信号' },
            { text: '悲伤之下的核心信息常是“我失去了重要的东西”或“我渴望连接”。试着帮对方或自己去触碰那个核心信息。', exp: '深层共情是听到情绪背后的需要。通过NVC之耳，聆听悲伤背后未被满足的需要，能带来深刻的理解。', src: '非暴力沟通：听到需要' }
        ],
        lost: [
            { text: '最难表达的那句话，通常也是最需要说出来的。慢慢来，我们可以试着一起把它找出来。', exp: '非暴力沟通认为，那些最难说出口的话背后，往往是未被满足的深层需要。迷路不是因为你不会沟通，是因为那个需要还藏在模糊的感受下面。试着用“我感到...因为我需要...”的句式，通常能把那模糊的东西从暗处推到光里。', src: '非暴力沟通:需要索引' },
            { text: '如果你不知道如何开始一场艰难的对话，可以先说：“有件事我想了很久，不知道怎么开口。” 诚实永远是最好的开场。', exp: '以挣扎开场能迅速建立情感连接，卸下“我必须完美表达”的包袱，为后续的对话铺平道路。', src: '非暴力沟通：诚实地开始' },
            { text: '当你对自己和他人都感到困惑时，找一个安全的对象，单纯地倾诉，不需要答案。', exp: '《爱的五种语言》中的“精心的时刻”——全神贯注的倾听。被倾听的过程本身就是一种梳理，答案常常在倾诉中自动浮现。', src: '《爱的五种语言》：倾听即梳理' },
            { text: '沟通迷惘时，写下“我的观察、我的感受、我的需要、我的请求”四个标题，然后试着填空。', exp: '这是非暴力沟通的经典四要素框架。在混乱中提供结构，帮你理清思路，把模糊不满转化为具体请求。', src: '非暴力沟通：四要素练习' },
            { text: '如果不知道该说什么，试着用“我此刻感到……”开头，然后哪怕只说一个形容词，如“无助”，也是突破。', exp: '从最简单的自我揭示开始。一旦开启了第一人称的感受表达，沟通的僵局就会被打破。', src: '非暴力沟通：从感受开始' },
            { text: '给自己许可：“我不需要既当心理学家又当沟通大师。我只是一个人，在试着和另一个人连接。”', exp: '减少角色压力。沟通是人与人之间的事，不是专家对听众。允许自己笨拙，是通往自然的前提。', src: '非暴力沟通：放下面具' },
            { text: '有时，最好的沟通是先和自己沟通。静坐片刻，问自己：“我真正想说的是什么？我真正需要的是什么？”', exp: '自我连接是有效沟通的起点。先理清自己的内在，才能更清晰、更平和地表达给他人。', src: '非暴力沟通：自我连接' },
            { text: '沟通迷路时，尝试先完全复述对方的话，并询问：“你的意思是……吗？” 这能确保你们走在同一条路上。', exp: '复述与澄清是防止误解的利器。它既能表达尊重和倾听，又能确保你理解了对方，是走出沟通迷雾的法宝。', src: '非暴力沟通：反馈式倾听' },
