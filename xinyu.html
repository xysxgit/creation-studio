            const SentenceEngine = (() => {
                let currentStage = 'celebration', currentRole = 'self', explainVisible = false;
                const lastTexts = {};
                function getSentence() {
                    const pool = sentencesDB[currentRole]?.[currentStage];
                    if (!pool || !pool.length) return { text: '这里还很安静，等待你的句子来填满。', exp: '', src: '' };
                    const last = lastTexts[currentRole + currentStage] || '';
                    let picked;
                    if (pool.length === 1) picked = pool[0];
                    else do { picked = pool[Math.floor(Math.random() * pool.length)]; } while (picked.text === last);
                    lastTexts[currentRole + currentStage] = picked.text;
                    return picked;
                }
                function applyStage(stageKey) {
                    currentStage = stageKey;
                    const s = stages.find(x => x.key === stageKey) || stages[0];
                    document.documentElement.style.setProperty('--bg-start', s.bgStart);
                    document.documentElement.style.setProperty('--bg-end', s.bgEnd);
                    document.documentElement.style.setProperty('--accent', s.accent);
                    document.getElementById('stageLabel').innerHTML = `${s.icon} ${s.label}`;
                }
                function updateAll() {
                    applyStage(currentStage);
                    const sentence = getSentence();
                    document.getElementById('sentenceText').textContent = sentence.text;
                    document.getElementById('explanationText').textContent = sentence.exp || '';
                    document.getElementById('explanationSource').textContent = sentence.src ? `——${sentence.src}` : '';
                    const role = roles.find(r => r.key === currentRole);
                    document.getElementById('roleBadge').textContent = `${role.emoji} ${role.label}视角`;
                    updateFavButton(sentence.text);
                    const favBtn = document.getElementById('favoriteBtn');
                    if (favBtn) favBtn.onclick = () => { toggleFav(sentence.text, currentRole, currentStage); };
                    document.querySelectorAll('.role-btn').forEach(b => { b.classList.remove('active'); if (b.dataset.role === currentRole) b.classList.add('active'); });
                }
                function jumpTo(roleKey, stageKey) { currentRole = roleKey; currentStage = stageKey; updateAll(); }
                document.getElementById('stageGrid').innerHTML = stages.map(s => `<button class="stage-option" data-stage="${s.key}">${s.icon} ${s.label}</button>`).join('');
                document.getElementById('roleNav').innerHTML = roles.map(r => `<button class="role-btn ${r.key === currentRole ? 'active' : ''}" data-role="${r.key}"><span class="emoji">${r.emoji}</span>${r.label}</button>`).join('');
                document.getElementById('stageIndicator').addEventListener('click', () => { document.getElementById('stageModal').classList.remove('hidden'); });
                document.getElementById('stageGrid').addEventListener('click', e => { const btn = e.target.closest('.stage-option'); if (!btn) return; currentStage = btn.dataset.stage; document.getElementById('stageModal').classList.add('hidden'); updateAll(); if (window.resetGame) window.resetGame(); });
                document.getElementById('stageModal').addEventListener('click', e => { if (e.target === document.getElementById('stageModal')) document.getElementById('stageModal').classList.add('hidden'); });
                document.getElementById('roleNav').addEventListener('click', e => { const btn = e.target.closest('.role-btn'); if (!btn) return; currentRole = btn.dataset.role; updateAll(); });
                document.getElementById('refreshBtn').addEventListener('click', updateAll);
                document.getElementById('toggleExplainBtn').addEventListener('click', () => { explainVisible = !explainVisible; document.getElementById('explanationBox').classList.toggle('visible', explainVisible); document.getElementById('toggleExplainBtn').textContent = explainVisible ? '📖 隐藏解释' : '📖 显示解释'; });
                let currentSpecificSentence = null;

function showSpecific(sentenceObj, roleKey, stageKey) {
    currentRole = roleKey;
    currentStage = stageKey;
    currentSpecificSentence = sentenceObj;
    updateAll();
    currentSpecificSentence = null; // 用后即弃，不影响正常随机
}

function updateAll() {
    applyStage(currentStage);

    let sentence;
    if (currentSpecificSentence) {
        sentence = currentSpecificSentence;
    } else {
        sentence = getSentence();
    }

    document.getElementById('sentenceText').textContent = sentence.text;
    document.getElementById('explanationText').textContent = sentence.exp || '';
    document.getElementById('explanationSource').textContent = sentence.src ? `——${sentence.src}` : '';
    const role = roles.find(r => r.key === currentRole);
    document.getElementById('roleBadge').textContent = `${role.emoji} ${role.label}视角`;
    updateFavButton(sentence.text);
    const favBtn = document.getElementById('favoriteBtn');
    if (favBtn) favBtn.onclick = () => { toggleFav(sentence.text, currentRole, currentStage); };
    document.querySelectorAll('.role-btn').forEach(b => { b.classList.remove('active'); if (b.dataset.role === currentRole) b.classList.add('active'); });
}

return { updateAll, getCurrentStage: () => currentStage, jumpTo, showSpecific };

            // ==================== 游戏模块（性能优化版） ====================
            const GameModule = (() => {
                const { posWords, negWords, bombWord, difficultyLevels, permanentItems } = gameConfig;
                const warmColors = ['#e8c88a','#d8b070','#c8a060','#b89050'];
                const coolColors = ['#8899bb','#7888aa','#687799','#586688'];
                const praiseNeg = [{ min:35, texts:['全甩掉啦！','烟消云散！'] },{ min:25, texts:['纷纷坠落！','痛快！'] },{ min:18, texts:['轻松击破！','划走不送！'] },{ min:12, texts:['走你！','嗖！'] },{ min:6, texts:['去去去！','躲开！'] },{ min:3, texts:['走开！','闪！'] },{ min:1, texts:['咻！','咔嚓！'] }];
                const praisePos = [{ min:35, texts:['统统收到！','光芒万丈！'] },{ min:25, texts:['聚起来了！','闪闪发光！'] },{ min:18, texts:['收下了！','接住啦！'] },{ min:12, texts:['过来！','有啦！'] },{ min:6, texts:['来！','抓！'] },{ min:3, texts:['得！','收！'] },{ min:1, texts:['拿！','捡！'] }];
                const heartTexts = ['爱了爱了！','好暖呀！','心动了！','比心心！','甜甜的！','暖到心里了！','被治愈了！','好温柔！','心里亮亮的！','暖暖抱抱！','太美好了！','幸福涌上来！','感动到哭！','心花开了！','满满的爱！','超级暖心！','被爱包围！','心在发光！','温柔一击！','甜蜜暴击！','好喜欢！'];
                const floatColorsNeg = ['#a0b0cc','#90a0bc','#8090ac','#70809c'];
                const floatColorsPos = ['#e8c88a','#d8b070','#c8a060','#b89050'];

                let gameMode='negative',running=false,phase='normal',score=0,lives=5,combo=0;
                let emotions=[],particlesEff=[],floatingTexts=[],trailPoints=[];
                let canvas,ctx,W,H,lastTime=0,spawnTimer=0,specialTimer=10,specialWord='';
                let superActive=false,superTextObj=null,superScale=0.5;
                let shattering=false,shatterTimer=0,shatterParticles=[];
                const GRAVITY=580;
                const COLLISION_PADDING = 8; // 扩大碰撞检测边距
                let specialFeedback=null,cachedPraise=null,lastCombo=-1;
                let unlocked = new Set(JSON.parse(localStorage.getItem('emo_unlocked')||'[]'));

                // 【优化1】预计算的离屏Canvas，缓存文字渲染结果，避免每帧重复调用fillText测量
                let textMeasureCache = new Map();
                function measureText(text, fontSize) {
                    const key = `${text}_${fontSize}`;
                    if (textMeasureCache.has(key)) {
                        return textMeasureCache.get(key);
                    }
                    ctx.font = `bold ${fontSize}px "PingFang SC"`;
                    const metrics = ctx.measureText(text);
                    const result = { width: metrics.width, height: fontSize };
                    // 限制缓存大小，防止无限增长
                    if (textMeasureCache.size > 200) {
                        const firstKey = textMeasureCache.keys().next().value;
                        textMeasureCache.delete(firstKey);
                    }
                    textMeasureCache.set(key, result);
                    return result;
                }

                function getBaseLives(){ return unlocked.has('extraLife')?6:5; }
                function hasComboProtect(){ return unlocked.has('comboProtect'); }
                function isDoubleScore(){ return unlocked.has('doubleScore'); }
                function getSpecialTime(){ return unlocked.has('extraTime')?20:10; }
                function updateHeartDisplay(){ document.getElementById('heartCount').textContent=`💗 x ${window.collectedHearts}`; }
                function addHeart(){ window.collectedHearts++; localStorage.setItem('emo_hearts', window.collectedHearts); updateHeartDisplay(); }
                window.updateHeartDisplay = updateHeartDisplay;

                const canvasEl=document.getElementById('gameCanvas');
                ctx=canvasEl.getContext('2d');
                // 【优化2】关闭Canvas默认的抗锯齿以减轻GPU负担（对文字影响微乎其微）
                // 不做强制关闭，但减少shadowBlur的使用频率
                function resizeCanvas(){ 
                    const dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制像素比最大为2
                    const rect = canvasEl.parentElement.getBoundingClientRect();
                    const displayWidth = rect.width - 24;
                    const displayHeight = 320;
                    canvasEl.width = displayWidth * dpr;
                    canvasEl.height = displayHeight * dpr;
                    canvasEl.style.width = displayWidth + 'px';
                    canvasEl.style.height = displayHeight + 'px';
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.scale(dpr, dpr);
                    W = displayWidth;
                    H = displayHeight;
                    // 清空文字测量缓存，因为尺寸变了
                    textMeasureCache.clear();
                }
                resizeCanvas(); window.addEventListener('resize',resizeCanvas);

                function getTargetWords(){ return gameMode==='negative'?negWords:posWords; }
                function isPositiveWord(w){ return posWords.includes(w); }
                function getDifficulty(){ for (let lvl of difficultyLevels) { if (score >= lvl.score) return lvl; } return difficultyLevels[difficultyLevels.length-1]; }
                function getPraiseText(){ if(combo!==lastCombo||cachedPraise===null){ const pool=gameMode==='negative'?praiseNeg:praisePos; cachedPraise=null; for(let t of pool)if(combo>=t.min){cachedPraise=t.texts[Math.floor(Math.random()*t.texts.length)];break;} lastCombo=combo; } return cachedPraise; }
                function getRandomHeartText(){ return heartTexts[Math.floor(Math.random()*heartTexts.length)]; }
                function setSpecialFeedback(text,color,duration=0.6){ specialFeedback={text,color,until:performance.now()/1000+duration}; updateComboDisplay(); }

                function spawnHeart(){ 
                    const fontSize=38; 
                    const m = measureText('❤️', fontSize);
                    emotions.push({
                        text:'❤️',x:20+Math.random()*(W-m.width-40),y:H-10,
                        w:m.width,h:m.height, 
                        vx:(Math.random()-0.5)*180,vy:-360-Math.random()*120,
                        size:fontSize,color:'#ff69b4', 
                        target:true,bomb:false,isHeart:true,cut:false,
                        rotation:0,rotSpeed:0.1
                    }); 
                }
                function spawnEmotion(){
                    if(superActive||shattering)return;
                    const diff=getDifficulty();
                    if(phase==='special'){
                        const w=specialWord;
                        const fontSize=28+Math.floor(Math.random()*14); 
                        const m = measureText(w, fontSize);
                        const vy=-280-diff.speedBonus-Math.random()*180;
                        emotions.push({
                            text:w,x:20+Math.random()*(W-m.width-40),y:H-10,
                            w:m.width,h:m.height, 
                            vx:(Math.random()-0.5)*100,vy,
                            size:fontSize, 
                            color:isPositiveWord(w)?warmColors[Math.floor(Math.random()*4)]:coolColors[Math.floor(Math.random()*4)], 
                            target:true,bomb:false,cut:false,
                            rotation:0,rotSpeed:(Math.random()-0.5)*0.1
                        });
                        return;
                    }
                    const bomb=Math.random()<diff.bombChance;
                    if(bomb){ 
                        const sz=32; 
                        const m = measureText(bombWord, sz);
                        const vy=-280-diff.speedBonus-Math.random()*80; 
                        emotions.push({
                            text:bombWord,x:20+Math.random()*(W-m.width-40),y:H-10,
                            w:m.width,h:sz, 
                            vx:(Math.random()-0.5)*90,vy,
                            size:sz,color:'#ff4444',
                            target:false,bomb:true,cut:false,
                            rotation:0,rotSpeed:0
                        }); 
                        return; 
                    }
                    const useTarget=Math.random()<0.5;
                    const pool=useTarget?getTargetWords():(gameMode==='negative'?posWords:negWords);
                    const w=pool[Math.floor(Math.random()*pool.length)];
                    const isPos=isPositiveWord(w);
                    const col=(isPos?warmColors:coolColors)[Math.floor(Math.random()*4)];
                    const sz=26+Math.floor(Math.random()*14);
                    const m = measureText(w, sz);
                    const vy=-260-diff.speedBonus-Math.random()*140;
                    emotions.push({
                        text:w,x:20+Math.random()*(W-m.width-40),y:H-10,
                        w:m.width,h:m.height, 
                        vx:(Math.random()-0.5)*100,vy,
                        size:sz,color:col,
                        target:useTarget,bomb:false,cut:false, 
                        rotation:0,rotSpeed:(Math.random()-0.5)*0.08
                    });
                }
                function addParticles(x,y,type){
                    let count,colors,radiusRange;
                    if(type==='target'){
                        // 【优化3】减少粒子数量但保持视觉密度（通过稍微增大半径补偿）
                        count=10;
                        if(gameMode==='negative'){
                            colors=[[160,180,210],[150,170,200],[170,190,220]];
                            radiusRange=[2,6];
                        }else{
                            colors=[[232,200,138],[216,176,112],[200,160,96],[184,144,80]];
                            radiusRange=[3,7];
                        }
                        for(let i=0;i<count;i++){
                            const c=colors[Math.floor(Math.random()*colors.length)];
                            const angle=Math.random()*Math.PI*2,speed=150+Math.random()*200;
                            particlesEff.push({
                                x,y,
                                vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
                                op:0.9,
                                radius:radiusRange[0]+Math.random()*(radiusRange[1]-radiusRange[0]),
                                r:c[0],g:c[1],b:c[2]
                            });
                        }
                    }else if(type==='bomb'){
                        count=12;
                        colors=[[255,60,60],[200,20,20],[255,80,40]];
                        radiusRange=[3,7];
                        for(let i=0;i<count;i++){
                            const c=colors[Math.floor(Math.random()*colors.length)];
                            const angle=Math.random()*Math.PI*2,speed=150+Math.random()*200;
                            particlesEff.push({
                                x,y,
                                vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
                                op:0.9,
                                radius:radiusRange[0]+Math.random()*(radiusRange[1]-radiusRange[0]),
                                r:c[0],g:c[1],b:c[2]
                            });
                        }
                    }else{
                        count=5;
                        colors=[[220,80,80],[180,50,50]];
                        radiusRange=[1.5,4];
                        for(let i=0;i<count;i++){
                            const c=colors[Math.floor(Math.random()*colors.length)];
                            const angle=Math.random()*Math.PI*2,speed=60+Math.random()*100;
                            particlesEff.push({
                                x,y,
                                vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
                                op:0.9,
                                radius:radiusRange[0]+Math.random()*(radiusRange[1]-radiusRange[0]),
                                r:c[0],g:c[1],b:c[2]
                            });
                        }
                    }
                }
                function addFloatingText(x,y,text){ 
                    const colors=gameMode==='negative'?floatColorsNeg:floatColorsPos; 
                    const color=colors[combo%colors.length]; 
                    floatingTexts.push({x,y,text,color,life:1.8,vy:-60}); 
                }
                function updateComboDisplay(){
                    const comboEl=document.getElementById('comboDisplay');
                    const now=performance.now()/1000;
                    if(specialFeedback&&now<specialFeedback.until){ 
                        comboEl.textContent=specialFeedback.text; 
                        comboEl.style.color=specialFeedback.color; 
                        comboEl.style.fontSize='1.1rem'; 
                        comboEl.style.textShadow=`0 0 12px ${specialFeedback.color}`; 
                        comboEl.style.transform='scale(1.1)'; 
                        return; 
                    } else if(specialFeedback){ 
                        specialFeedback=null; 
                    }
                    if(combo>=3){ 
                        const p=getPraiseText();
                        const scale=Math.min(0.85+combo*0.03,1.5); 
                        const hue=gameMode==='negative'?220+combo*2:35+combo*3; 
                        comboEl.textContent=`🔥 ${combo}连击！${p||''}`; 
                        comboEl.style.color=`hsl(${hue},40%,70%)`; 
                        comboEl.style.fontSize=`${scale}rem`; 
                        // 【优化4】仅在5连击倍数时使用阴影，减少GPU合成负担
                        if (combo % 5 === 0) {
                            comboEl.style.textShadow = `0 0 ${scale*6}px currentColor`;
                        } else {
                            comboEl.style.textShadow = 'none';
                        }
                        if(combo%5===0){ 
                            comboEl.style.transform='scale(1.1)'; 
                            requestAnimationFrame(()=>{ comboEl.style.transform='scale(1)'; }); 
                        } 
                    }else{
                        comboEl.textContent='';
                        comboEl.style.fontSize='0.85rem';
                        comboEl.style.textShadow='none';
                        comboEl.style.transform='scale(1)';
                    }
                }
                function updateUI(){ 
                    document.getElementById('scoreDisplay').textContent=`${score} 分`; 
                    document.getElementById('livesDisplay').textContent=(phase==='special'||superActive||shattering)?'♾️ 无限':'❤️'.repeat(Math.max(0,lives)); 
                    document.getElementById('difficultyDisplay').textContent=getDifficulty().label; 
                    updateComboDisplay(); 
                }
                function draw(){
                    ctx.clearRect(0,0,W,H);
                    
                    // 【优化5】只绘制最近15个拖尾点
                    ctx.save();
                    const recentTrails = trailPoints.slice(-15);
                    for(let i=1;i<recentTrails.length;i++){ 
                        const p0=recentTrails[i-1],p1=recentTrails[i];
                        const alpha=Math.min(p0.life,p1.life)/0.4; 
                        const col=gameMode==='negative'?`rgba(170,180,220,${alpha*0.8})`:`rgba(240,200,150,${alpha*0.9})`; 
                        ctx.beginPath(); 
                        ctx.moveTo(p0.x,p0.y); 
                        ctx.lineTo(p1.x,p1.y); 
                        ctx.strokeStyle=col; 
                        ctx.lineWidth=5*alpha; 
                        ctx.lineCap='round'; 
                        // 减少阴影使用
                        ctx.shadowBlur = 0;
                        ctx.stroke(); 
                    }
                    ctx.restore();
                    
                    shatterParticles.forEach(p=>{
                        ctx.fillStyle=`rgba(${p.r},${p.g},${p.b},${p.op})`;
                        ctx.beginPath();
                        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
                        ctx.fill();
                    });
                    
                    if(superActive&&superTextObj&&!shattering){ 
                        superScale+=(1-superScale)*0.08; 
                        const fontSize=Math.floor(70+Math.sin(Date.now()*0.01)*10); 
                        ctx.font=`bold ${fontSize}px "PingFang SC"`; 
                        const colorIndex=Math.floor(Date.now()/200)%superTextObj.colors.length; 
                        ctx.fillStyle=superTextObj.colors[colorIndex]; 
                        ctx.shadowBlur=20; 
                        ctx.textAlign='center'; 
                        ctx.save(); 
                        ctx.translate(W/2,H/2+10); 
                        ctx.rotate(Math.sin(Date.now()*0.004)*0.06); 
                        ctx.fillText(superTextObj.text,0,0); 
                        ctx.restore(); 
                        ctx.shadowBlur=0; 
                        ctx.textAlign='start'; 
                    }
                    
                    emotions.forEach(e=>{
                        if(e.cut)return; 
                        ctx.save(); 
                        ctx.translate(e.x+e.w/2,e.y-e.size/2); 
                        if(e.rotation!==undefined){
                            e.rotation+=e.rotSpeed||0;
                            ctx.rotate(e.rotation);
                        } 
                        ctx.font=`bold ${e.size}px "PingFang SC"`; 
                        ctx.fillStyle=e.color; 
                        ctx.shadowBlur=0; // 关闭阴影以减少GPU负担
                        ctx.textAlign='center'; 
                        ctx.fillText(e.text,0,e.size/2); 
                        ctx.restore();
                    });
                    
                    if((phase==='special'||superActive||shattering)&&specialTimer>0){ 
                        ctx.fillStyle='#ccc'; 
                        ctx.font='12px "PingFang SC"'; 
                        ctx.textAlign='right'; 
                        ctx.fillText(`${Math.ceil(Math.max(0,specialTimer))}s`,W-10,20); 
                        ctx.textAlign='start'; 
                    }
                    
                    // 【优化6】批量绘制粒子，减少状态切换
                    if (particlesEff.length > 0) {
                        ctx.save();
                        for (let i = 0; i < particlesEff.length; i++) {
                            const p = particlesEff[i];
                            ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${p.op})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                    
                    // 【优化7】批量绘制浮动文字
                    if (floatingTexts.length > 0) {
                        ctx.save();
                        ctx.font = 'bold 18px "PingFang SC"';
                        ctx.textAlign = 'center';
                        for (let i = 0; i < floatingTexts.length; i++) {
                            const t = floatingTexts[i];
                            ctx.fillStyle = t.color;
                            ctx.fillText(t.text, t.x, t.y);
                        }
                        ctx.textAlign = 'start';
                        ctx.restore();
                    }
                }
                function update(dt){
                    if(shattering){
                        shatterTimer-=dt; 
                        shatterParticles.forEach(p=>{
                            p.x+=p.vx*dt;
                            p.y+=p.vy*dt;
                            p.op-=1.5*dt;
                        }); 
                        shatterParticles=shatterParticles.filter(p=>p.op>0); 
                        if(shatterTimer<=0){
                            shattering=false;
                            shatterParticles=[];
                            showResult();
                        } 
                        updateUI(); 
                        return;
                    }
                    if((phase==='special'||superActive)&&running){ 
                        specialTimer-=dt; 
                        if(specialTimer<=5&&!superActive&&phase==='special'){
                            superActive=true;
                            superScale=0.3;
                            superTextObj={
                                text:specialWord,
                                colors:['#ff97a0','#ffb347','#ffd700','#99ff99','#66ccff','#c0a0ff','#ff88cc','#88ffcc'],
                                color:isPositiveWord(specialWord)?'#e8c88a':'#8899bb'
                            };
                            // 清理以释放内存
                            emotions=[];
                            particlesEff=[];
                            floatingTexts=[];
                            combo=0;
                        } 
                        if(specialTimer<=0){ 
                            if(superActive){
                                running=false;
                                superActive=false;
                                shattering=true;
                                shatterTimer=0.8;
                                const cx=W/2,cy=H/2;
                                let r=255,g=180,b=100;
                                const col=superTextObj?.color||'#e8c88a';
                                if(col.startsWith('#')){
                                    r=parseInt(col.slice(1,3),16);
                                    g=parseInt(col.slice(3,5),16);
                                    b=parseInt(col.slice(5,7),16);
                                }
                                for(let i=0;i<30;i++){ // 减少碎裂粒子
                                    const a=Math.random()*Math.PI*2,sp=150+Math.random()*250;
                                    shatterParticles.push({
                                        x:cx,y:cy,
                                        vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
                                        op:1,
                                        radius:3+Math.random()*6,
                                        r,g,b
                                    });
                                }
                                superTextObj=null;
                            } else{
                                running=false;
                                showResult();
                            } 
                        } 
                    }
                    if(!shattering){
                        // 使用倒序遍历以便安全地标记 cut
                        for (let i = emotions.length - 1; i >= 0; i--) {
                            const e = emotions[i];
                            if (e.cut) continue;
                            e.vy += GRAVITY * dt;
                            e.x += e.vx * dt;
                            e.y += e.vy * dt;
                            if (e.y > H + 100 || e.x < -150 || e.x > W + 150) {
                                if (!e.bomb && e.target && !e.isHeart && phase === 'normal') {
                                    if (hasComboProtect() && combo >= 10) {
                                        // 连击保护，不扣血
                                    } else {
                                        lives--;
                                        combo = 0;
                                    }
                                    if (lives <= 0) {
                                        running = false;
                                        triggerSpecialOrEnd();
                                    }
                                }
                                e.cut = true;
                            }
                        }
                        
                        // 【优化8】限制粒子总数为80，防止爆发时堆积
                        if (particlesEff.length > 80) {
                            particlesEff.splice(0, particlesEff.length - 80);
                        }
                        particlesEff.forEach(p=>{
                            p.x+=p.vx*dt;
                            p.y+=p.vy*dt;
                            p.op-=2.2*dt;
                        }); 
                        particlesEff=particlesEff.filter(p=>p.op>0);
                        
                        floatingTexts.forEach(t=>{
                            t.y+=t.vy*dt;
                            t.life-=dt;
                        }); 
                        floatingTexts=floatingTexts.filter(t=>t.life>0);
                        
                        // 【优化9】限制拖尾点为30个
                        for(let i=trailPoints.length-1;i>=0;i--){
                            trailPoints[i].life-=dt;
                            if(trailPoints[i].life<=0) trailPoints.splice(i,1);
                        }
                        if (trailPoints.length > 30) {
                            trailPoints.splice(0, trailPoints.length - 30);
                        }
                        
                        // 【优化10】限制情绪词数量，超过20个时强制清理屏幕外的
                        if (emotions.length > 20) {
                            let activeCount = 0;
                            for (let i = emotions.length - 1; i >= 0; i--) {
                                if (!emotions[i].cut) activeCount++;
                                if (activeCount > 20) {
                                    // 移除最早的非特殊词
                                    if (!emotions[i].bomb && !emotions[i].isHeart && !emotions[i].cut) {
                                        emotions[i].cut = true;
                                        activeCount--;
                                    }
                                }
                            }
                        }
                        
                        if(running&&!superActive){
                            spawnTimer+=dt; 
                            const interval=phase==='special'?0.32:getDifficulty().interval; 
                            if(spawnTimer>=interval){
                                spawnTimer=0;
                                spawnEmotion();
                            }
                        }
                    }
                    updateUI();
                }
                function handleSlice(x,y,px,py){
                    if(!running)return;
                    trailPoints.push({x,y,life:0.4});
                    if(superActive&&superTextObj){
                        const rect={x:W/2-60,y:H/2-50,w:120,h:100};
                        if(x>rect.x&&x<rect.x+rect.w&&y>rect.y&&y<rect.y+rect.h){
                            score++;
                            combo++;
                            addParticles(W/2,H/2-10,'target');
                            updateUI();
                            if(combo>0&&combo%10===0)spawnHeart();
                            return;
                        }
                    }
                    // 从后往前遍历，优先响应最新出现的词
                    for(let i = emotions.length - 1; i >= 0; i--){
                        const e = emotions[i];
                        if(e.cut) continue;
                        // 扩大碰撞检测区域
                        const box = { 
                            x: e.x - COLLISION_PADDING, 
                            y: e.y - e.size - COLLISION_PADDING, 
                            w: e.w + COLLISION_PADDING*2, 
                            h: e.size + COLLISION_PADDING*2 
                        };
                        if(x>box.x&&x<box.x+box.w&&y>box.y&&y<box.y+box.h){
                            e.cut=true;
                            if(e.isHeart){
                                lives=Math.min(getBaseLives(),lives+1);
                                score+=5;
                                combo++;
                                addHeart();
                                addParticles(e.x+e.w/2,e.y-e.size/2,'target');
                                addFloatingText(e.x+e.w/2,e.y-e.size/2,'+5 ❤️');
                                setSpecialFeedback(getRandomHeartText(),'#ff69b4');
                                if(combo>0&&combo%10===0)spawnHeart();
                            }
                            else if(e.bomb){
                                lives=Math.max(0,lives-2);
                                combo=0;
                                addParticles(e.x+e.w/2,e.y-e.size/2,'bomb');
                                setSpecialFeedback('💥 炸了！','#ff4444');
                            }
                            else if(e.target){
                                let points=isDoubleScore()?2:1;
                                score+=points;
                                combo++;
                                const p=getPraiseText();
                                if(p)addFloatingText(e.x+e.w/2,e.y-e.size/2,p);
                                addParticles(e.x+e.w/2,e.y-e.size/2,'target');
                                if(combo>0&&combo%10===0)spawnHeart();
                            }
                            else{
                                lives--;
                                combo=0;
                                addParticles(e.x+e.w/2,e.y-e.size/2,'wrong');
                                setSpecialFeedback('划错啦','#ff8888');
                            }
                            if(phase==='normal'&&lives<=0){
                                running=false;
                                triggerSpecialOrEnd();
                            }
                            updateUI(); 
                            break;
                        }
                    }
                }
                let lastPos=null;
                function getPos(e){
                    const rect=canvasEl.getBoundingClientRect();
                    const sx=W/rect.width,sy=H/rect.height;
                    const cx=e.touches?e.touches[0].clientX:e.clientX;
                    const cy=e.touches?e.touches[0].clientY:e.clientY;
                    return{x:(cx-rect.left)*sx,y:(cy-rect.top)*sy};
                }
                canvasEl.addEventListener('touchstart',e=>{e.preventDefault();lastPos=getPos(e);});
                canvasEl.addEventListener('touchmove',e=>{e.preventDefault();const p=getPos(e);if(p&&lastPos){handleSlice(p.x,p.y,lastPos.x,lastPos.y);lastPos=p;}});
                canvasEl.addEventListener('touchend',()=>lastPos=null);
                canvasEl.addEventListener('mousedown',e=>{lastPos=getPos(e);});
                canvasEl.addEventListener('mousemove',e=>{if(e.buttons!==1)return;const p=getPos(e);if(p&&lastPos){handleSlice(p.x,p.y,lastPos.x,lastPos.y);lastPos=p;}});
                canvasEl.addEventListener('mouseup',()=>lastPos=null);

                const STORAGE_KEY='emotion_cutter_leaderboard';
                function loadLB(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return[];}}
                function saveLB(e){let b=loadLB();b.push(e);b.sort((a,b)=>b.score-a.score);if(b.length>20)b.length=20;localStorage.setItem(STORAGE_KEY,JSON.stringify(b));}
                function renderLB(){const b=loadLB();document.getElementById('rankBody').innerHTML=b.length===0?'<tr><td colspan="3">暂无记录</td></tr>':b.slice(0,10).map((e,i)=>`<tr><td>${i+1}</td><td>${e.score}分</td><td>${e.date}</td></tr>`).join('');}
                const stageNames={celebration:'开心庆祝',tired:'累了疲惫',anxiety:'紧张焦虑',sadness:'难过失落',relationship:'感情相关',lost:'迷茫方向',strive:'励志奋斗'};
                function getMessage(){ if(score>30)return'你像一阵温柔的风，把烦恼都吹散了。'; if(score>15)return'划走阴霾，心里敞亮多了。'; return'每一次切割，都是对自己的关照。'; }
                function showResult(){ const sName=stageNames[SentenceEngine.getCurrentStage()]||'未知',msg=getMessage(),now=new Date(); const ds=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`; saveLB({score,stage:SentenceEngine.getCurrentStage(),mode:gameMode,date:ds}); document.getElementById('resultTitle').textContent=`结算 · ${sName}`; document.getElementById('resultMessage').textContent=`「${msg}」`; document.getElementById('resultScore').textContent=score; document.getElementById('resultModal').classList.remove('hidden'); resetGame(); }
                function resetGame(){ running=false; phase='normal'; score=0; lives=getBaseLives(); combo=0; emotions=[]; particlesEff=[]; floatingTexts=[]; trailPoints=[]; superActive=false; superTextObj=null; specialTimer=getEffectiveSpecialTime(); shattering=false; shatterParticles=[]; document.getElementById('actionBtn').textContent='▶ 开始游戏'; document.getElementById('specialModal').classList.add('hidden'); updateUI(); }
                function startGame(){ if(running)return; if(phase==='normal'&&lives<=0)resetGame(); else { lives=getBaseLives(); } running=true; document.getElementById('actionBtn').textContent='⏸️ 暂停'; lastTime=performance.now(); updateUI(); }
                function getEffectiveSpecialTime() { const base = getSpecialTime(); const bonus = Math.floor(score / 10); return Math.max(10, Math.min(60, base + bonus)); }
                function triggerSpecialOrEnd(){ document.getElementById('specialOptions').innerHTML=getTargetWords().map(w=>`<button class="special-option">${w}</button>`).join(''); document.getElementById('specialModal').classList.remove('hidden'); }
                document.getElementById('specialOptions').addEventListener('click', e => { const btn=e.target.closest('.special-option'); if(!btn)return; specialWord=btn.textContent; phase='special'; specialTimer=getEffectiveSpecialTime(); lives=99; score=0; combo=0; emotions=[]; particlesEff=[]; floatingTexts=[]; superActive=false; superTextObj=null; document.getElementById('specialModal').classList.add('hidden'); running=true; document.getElementById('actionBtn').textContent='⏸️ 爽切中'; lastTime=performance.now(); updateUI(); });
                document.getElementById('skipSpecialBtn').addEventListener('click',()=>{document.getElementById('specialModal').classList.add('hidden');showResult();});
                document.getElementById('actionBtn').addEventListener('click',()=>{if(running){running=false;document.getElementById('actionBtn').textContent='▶ 继续';}else startGame();});
                document.getElementById('modeNeg').addEventListener('click',()=>{if(running){running=false;document.getElementById('actionBtn').textContent='▶ 继续';}document.getElementById('modeNeg').classList.add('active');document.getElementById('modePos').classList.remove('active');gameMode='negative';document.getElementById('hint').textContent='🎯 划走得分的词';resetGame();});
                document.getElementById('modePos').addEventListener('click',()=>{if(running){running=false;document.getElementById('actionBtn').textContent='▶ 继续';}document.getElementById('modePos').classList.add('active');document.getElementById('modeNeg').classList.remove('active');gameMode='positive';document.getElementById('hint').textContent='🎯 收集得分的词';resetGame();});
                document.getElementById('restartBtn').addEventListener('click',()=>{document.getElementById('resultModal').classList.add('hidden');resetGame();});
                document.getElementById('goToLeaderboardBtn').addEventListener('click',()=>{document.getElementById('resultModal').classList.add('hidden');renderLB();document.getElementById('leaderboardModal').classList.remove('hidden');});
                document.getElementById('openLeaderboardBtn').addEventListener('click',()=>{renderLB();document.getElementById('leaderboardModal').classList.remove('hidden');});
                document.getElementById('closeLeaderboardBtn').addEventListener('click',()=>{document.getElementById('leaderboardModal').classList.add('hidden');});
                function purchaseItem(key){ const item=permanentItems.find(i=>i.key===key); if(!item||unlocked.has(key)||window.collectedHearts<item.cost)return; if(!confirm(`确定要花费 ${item.cost} 💗 永久解锁「${item.name}」吗？`))return; window.collectedHearts-=item.cost; localStorage.setItem('emo_hearts', window.collectedHearts); unlocked.add(key); localStorage.setItem('emo_unlocked',JSON.stringify([...unlocked])); updateHeartDisplay(); renderShop(); updateUI(); }
                function renderShop(){ document.getElementById('shopHeartDisplay').textContent=`当前 💗 x ${window.collectedHearts}`; const itemsDiv=document.getElementById('shopItems'); itemsDiv.innerHTML='<div class="shop-section"><h4>🔒 永久升级</h4></div>'; for(let item of permanentItems){ const isUnlocked=unlocked.has(item.key); const canAfford=window.collectedHearts>=item.cost&&!isUnlocked; itemsDiv.innerHTML+=`<div class="shop-item"><span><strong>${item.name}</strong><br><small>${item.desc}</small></span><span style="margin-right:8px;">${isUnlocked?'✔️ 已拥有':`💗 ${item.cost}`}</span><button onclick="window._purchase('${item.key}')" ${!canAfford?'disabled':''}>${isUnlocked?'已拥有':'解锁'}</button></div>`; } }
                function openShop(){ renderShop(); document.getElementById('shopModal').classList.remove('hidden'); }
                document.getElementById('shopBtn').addEventListener('click',openShop);
                document.getElementById('closeShopBtn').addEventListener('click',()=>document.getElementById('shopModal').classList.add('hidden'));
                document.getElementById('clearDataBtn').addEventListener('click',()=>{
                    if(!confirm('确定要清除所有游戏数据吗？此操作不可恢复。'))return;
                    localStorage.removeItem('emo_hearts'); localStorage.removeItem('emo_unlocked'); localStorage.removeItem('emotion_cutter_leaderboard'); localStorage.removeItem('my_report'); localStorage.removeItem('favorites'); localStorage.removeItem('my_matches');
                    window.collectedHearts=0; unlocked=new Set(); favorites = []; myMatches = []; saveFavorites(); saveMatches();
                    updateHeartDisplay(); updateUI(); alert('数据已清除。'); location.reload();
                });
                window._purchase=purchaseItem;
                window.renderShop = renderShop;
                
                // 【优化11】当页面不可见时暂停游戏循环
                let animFrameId;
                let pageVisible = true;
                document.addEventListener('visibilitychange', () => {
                    pageVisible = !document.hidden;
                    if (!pageVisible && running) {
                        // 页面隐藏时自动暂停
                        // 保持running状态但跳过渲染
                    }
                });
                
                function gameLoop(now){ 
                    if (!pageVisible && !shattering) {
                        // 页面不可见时降低刷新率
                        animFrameId = setTimeout(() => {
                            animFrameId = requestAnimationFrame(gameLoop);
                        }, 200); // 每200ms才检查一次
                        return;
                    }
                    
                    // 【优化12】游戏暂停且无动画时，降低刷新率
                    if (!running && !shattering && particlesEff.length === 0 && floatingTexts.length === 0) {
                        draw();
                        animFrameId = setTimeout(() => {
                            animFrameId = requestAnimationFrame(gameLoop);
                        }, 500); // 空闲时每500ms刷新一次
                        return;
                    }
                    
                    const dt=Math.min(0.05,(now-lastTime)/1000);
                    lastTime=now;
                    update(dt);
                    draw();
                    animFrameId = requestAnimationFrame(gameLoop);
                }
                window.resetGame=resetGame;
                updateHeartDisplay(); 
                resetGame(); 
                draw(); 
                animFrameId = requestAnimationFrame(gameLoop);
                
                // 清理函数
                window.addEventListener('beforeunload', () => {
                    if (animFrameId) {
                        cancelAnimationFrame(animFrameId);
                    }
                });
            })();

            SentenceEngine.updateAll();
            document.getElementById('stageModal').classList.remove('hidden');
        })();
    </script>
</body>
</html>
